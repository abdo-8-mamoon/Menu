<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f4">
<title>RestoFlow — شاشة الكاشير</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f3; --panel:#ffffff; --panel2:#fafaf8; --line:#e4e7e1; --line-soft:#edefea;
  --text:#20251d; --text-dim:#565f52; --muted:#868f81; --muted-dim:#adb5a8; --top-bg:rgba(245,246,243,.88);
  --sage:#4f8f5f; --sage-dim:#356a41; --sage-tint:#e9f4ea;
  --amber:#b8842f; --amber-dim:#8c6423; --amber-tint:#f7eedb;
  --brick:#c2492f; --brick-dim:#8f3924; --brick-tint:#fbe9e4;
  --shadow-sm:0 1px 2px rgba(32,37,29,.04);
  --shadow-md:0 1px 2px rgba(32,37,29,.04),0 10px 24px -14px rgba(32,37,29,.16);
  --shadow-lg:0 2px 4px rgba(32,37,29,.05),0 18px 36px -14px rgba(32,37,29,.22);
  --font-body:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#171b16; --panel:#20251f; --panel2:#252a23; --line:#333a2f; --line-soft:#2b3128;
  --text:#eaece5; --text-dim:#b8bfaf; --muted:#818a7b; --muted-dim:#565f50; --top-bg:rgba(23,27,22,.88);
  --sage-tint:#152418; --amber-tint:#291f0f; --brick-tint:#2b1712;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 18px 36px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
svg{display:block}
.tnum{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------------- header ---------------- */
.top{position:sticky;top:0;z-index:30;background:var(--top-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:15px 4vw;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--amber-tint);border:1px solid #b8842f3d;color:var(--amber-dim);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.brand .names{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-weight:700;font-size:16.5px}
.brand small{color:var(--muted);font-weight:500;font-size:12.5px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--text);transition:border-color .15s,transform .1s,box-shadow .15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--muted-dim);box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.pay{background:var(--sage);color:#fff;border-color:var(--sage)}
.btn.icon{width:38px;height:38px;padding:0;justify-content:center;background:var(--panel)}
.live-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 6px}
.live-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px var(--sage-tint)}

.container{max-width:1180px;margin:auto;padding:34px 4vw 16px}
.banner{border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:18px;display:flex;gap:9px;align-items:flex-start;line-height:1.6;background:var(--brick-tint);color:var(--brick-dim);border:1px solid #c2492f33}
.banner .x{margin-inline-start:auto;border:none;background:transparent;color:inherit;font-size:13px;opacity:.7;flex:none}

/* ---------------- utility strip: kpis + qr ---------------- */
.strip{display:grid;grid-template-columns:repeat(3,1fr) 1.9fr;gap:14px;margin-bottom:36px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px 20px;box-shadow:var(--shadow-sm)}
.stat .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.stat .lbl i{width:7px;height:7px;border-radius:50%;flex:none}
.stat.c-brick .lbl i{background:var(--brick)}.stat.c-amber .lbl i{background:var(--amber)}.stat.c-sage .lbl i{background:var(--sage)}
.stat b{display:block;font-size:27px;margin-top:11px;letter-spacing:-.02em}

.qr-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm)}
.qr-info{flex:1;min-width:0}
.qr-info .lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.qr-info .lbl i{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.qr-code{font-size:25px;font-weight:700;letter-spacing:4px;margin-top:9px}
.qr-code.loading{font-size:14px;letter-spacing:normal;color:var(--muted);font-weight:600}
.qr-meta{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.qr-until{font-size:12px;color:var(--text-dim)}
.qr-until b{font-weight:700;color:var(--text)}
.qr-count{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.qr-count.warn{color:var(--brick-dim);font-weight:600}
.qr-bar{height:4px;border-radius:100px;background:var(--line-soft);margin-top:10px;overflow:hidden}
.qr-bar-fill{height:100%;background:var(--amber);border-radius:100px;transition:width 1s linear}
.qr-bar-fill.warn{background:var(--brick)}
.qr-box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;place-items:center;min-height:96px;min-width:96px;flex:none}

/* ---------------- section / legend ---------------- */
.section-title{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.section-title h2{margin:0;font-size:19.5px;font-weight:700;letter-spacing:-.01em}
.legend{display:flex;gap:18px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .free i{background:var(--sage)}.legend .active i{background:var(--amber)}.legend .due i{background:var(--brick)}

/* ---------------- table grid ---------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:14px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:start;transition:transform .12s,box-shadow .15s;box-shadow:var(--shadow-sm)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.tile:active{transform:scale(.97)}
.tile .num{font-size:25px;font-weight:700;line-height:1;letter-spacing:-.02em}
.tile .status{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.tile .status i{width:6px;height:6px;border-radius:50%;flex:none}
.tile.free .status i{background:var(--sage)}
.tile.active{border-inline-start:3px solid var(--amber)}
.tile.active .status i{background:var(--amber)}
.tile.due{background:var(--brick-tint);border-color:transparent;border-inline-start:3px solid var(--brick);box-shadow:var(--shadow-md)}
.tile.due:hover{box-shadow:var(--shadow-lg)}
.tile.due .status i{background:var(--brick)}
.tile.due .amt{margin-top:12px;font-size:15.5px;font-weight:700;color:var(--brick-dim);padding-top:11px;border-top:1px solid #c2492f2b}
.tile.selected{outline:2px solid var(--text);outline-offset:2px}
.empty-note{text-align:center;padding:48px;color:var(--muted-dim);grid-column:1/-1}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;background:#181c1799;opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-inline-end:0;top:0;bottom:0;width:min(400px,92vw);background:var(--panel);z-index:41;border-inline-start:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{margin:0;font-size:18px}
.drawer-head .st{font-size:12.5px;color:var(--muted);margin-top:3px}
.drawer-close{border:none;background:var(--panel2);width:34px;height:34px;border-radius:10px;color:var(--text);display:grid;place-items:center;flex:none}
.drawer-body{padding:18px 20px;overflow-y:auto;flex:1}
.order-block{border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.order-block .oh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:9px}
.order-block .oh .badge{font-weight:700}
.order-block .oh .badge.served{color:var(--brick-dim)}
.order-block .oh .badge.active{color:var(--amber-dim)}
.item-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--text-dim)}
.item-row b{color:var(--text);font-weight:600}
.drawer-foot{padding:18px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.drawer-total{display:flex;justify-content:space-between;font-size:15.5px;font-weight:700}
.drawer-total .tnum{font-size:18px}
.drawer-empty{text-align:center;padding:40px 10px;color:var(--muted-dim);font-size:13.5px}

footer{padding:36px 4vw;color:var(--muted-dim);text-align:center;font-size:12.5px}

@media(max-width:900px){
  .strip{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c c"}
  .strip .stat:nth-child(1){grid-area:a}.strip .stat:nth-child(2){grid-area:b}.strip .stat:nth-child(3){display:none}
  .strip .qr-card{grid-area:c}
}
@media(max-width:640px){
  .strip{grid-template-columns:1fr;grid-template-areas:"a" "b" "c"}
  .strip .stat:nth-child(2){display:block}
  .grid{grid-template-columns:repeat(3,1fr)}
  .tile{padding:16px 10px}
  .container{padding:26px 5vw 12px}
  .brand small{display:none}
}
</style>
</head>
<body><div id="app"></div>
<script>
const ICONS={
  moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  sun:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  globe:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  close:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  warn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  clock:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'
};
const CONFIG={
  SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",
  RESTAURANT_NAME:"RestoFlow", CURRENCY:"ج.م", TABLES:30,
  QR_TABLE:"cashier_qr_codes",   // single seeded row, id = QR_ROW_ID, updated in place every hour
  QR_ROW_ID:"00000000-0000-0000-0000-000000000001" // fixed uuid — see migration SQL
};

let s={
  lang:"ar", sb:null, theme:localStorage.getItem("rf_theme")||"light",
  orders:[], loading:true, error:null,
  qr:{code:null,expiresAt:null,issuedAt:null,loading:true},
  now:new Date(),
  selectedTable:null, drawerOpen:false
};
const t=(a,e)=>s.lang==="ar"?a:e;
const money=n=>`${Number(n||0).toLocaleString(s.lang==="ar"?"ar-EG":"en-US")} ${CONFIG.CURRENCY}`;
const clockTime=d=>d?d.toLocaleTimeString(s.lang==="ar"?"ar-EG":"en-US",{hour:"2-digit",minute:"2-digit"}):"—";

/* ---------------- hourly QR code, updated in place ----------------
   A single seeded row (id = QR_ROW_ID, a fixed uuid) holds the current
   code. Every hour we overwrite that same row with a fresh code + new
   expiry instead of inserting a new one — the table never grows. Two
   cashier screens racing at the same moment both try to write;
   whichever write lands last simply wins, and both screens re-read the
   same row a moment later, so they stay in sync. Requires the
   migration (seeds that row + adds an UPDATE policy). */
function nextHourBoundary(d){
  const n=new Date(d); n.setUTCMinutes(0,0,0); n.setUTCHours(n.getUTCHours()+1); return n;
}
function randomCode(len=8){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous chars (0/O, 1/I)
  const bytes=new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>chars[b%chars.length]).join("");
}
async function ensureHourlyQR(){
  if(!s.sb)return;
  s.qr.loading=true; render();
  try{
    let {data,error}=await s.sb.from(CONFIG.QR_TABLE).select("*").eq("id",CONFIG.QR_ROW_ID).maybeSingle();
    if(error) throw error;
    const now=new Date();
    if(!data || !data.expires_at || new Date(data.expires_at)<=now){
      const expires=nextHourBoundary(now);
      const {data:upserted,error:upErr}=await s.sb.from(CONFIG.QR_TABLE)
        .upsert({id:CONFIG.QR_ROW_ID,code:randomCode(),expires_at:expires.toISOString()},{onConflict:"id"})
        .select().maybeSingle();
      if(upErr) throw upErr;
      data=upserted;
    }
    const expiresAt=new Date(data.expires_at);
    s.qr={code:data.code,expiresAt,issuedAt:new Date(expiresAt.getTime()-3600000),loading:false};
    s.error=null;
  }catch(e){
    s.qr.loading=false;
    s.error=e.message||String(e);
  }
  render();
}

/* ---------------- orders, grouped per table ---------------- */
async function fetchOrders(){
  if(!s.sb)return;
  s.loading=true;
  try{
    const {data,error}=await s.sb.from("orders").select("*,order_items(*)")
      .neq("status","paid").order("table_number",{ascending:true});
    if(error)throw error;
    s.orders=data||[];
    s.error=null;
  }catch(e){ s.error=e.message||String(e); }
  s.loading=false;
  render();
}
function ordersFor(n){ return s.orders.filter(o=>o.table_number===n); }
function tableState(n){
  const os=ordersFor(n);
  if(!os.length) return "free";
  if(os.some(o=>o.status==="served")) return "due";
  return "active";
}
function tableDue(n){
  return ordersFor(n).filter(o=>o.status==="served").reduce((a,o)=>a+Number(o.total||0),0);
}
function allDueTables(){
  const set=new Set();
  s.orders.forEach(o=>{ if(o.status==="served") set.add(o.table_number); });
  return [...set];
}

/* cashier action: mark every served (unpaid) order on that table as paid */
async function markTablePaid(n){
  if(!s.sb)return;
  const ids=ordersFor(n).filter(o=>o.status==="served").map(o=>o.id);
  if(!ids.length)return;
  const r=await s.sb.from("orders").update({status:"paid"}).in("id",ids);
  if(r.error){ alert(r.error.message); return; }
  s.drawerOpen=false; s.selectedTable=null;
  await fetchOrders();
}

/* ---------------- render ---------------- */
function header(){
  return `<header class="top">
    <div class="brand"><div class="mark">R</div><div class="names"><b>${CONFIG.RESTAURANT_NAME}</b><small>${t("شاشة الكاشير","Cashier screen")}</small></div></div>
    <div class="actions">
      <span class="live-pill"><span class="dot"></span>${t("متصل مباشرة","Live")}</span>
      <button class="btn icon" id="themeToggle">${s.theme==="dark"?ICONS.sun:ICONS.moon}</button>
      <button class="btn" id="lang">${ICONS.globe}${s.lang==="ar"?"EN":"عربي"}</button>
    </div>
  </header>`;
}
function qrProgress(){
  if(!s.qr.expiresAt||!s.qr.issuedAt) return 0;
  const total=s.qr.expiresAt-s.qr.issuedAt;
  const left=s.qr.expiresAt-s.now;
  return Math.max(0,Math.min(100,(left/total)*100));
}
function fmtCountdown(){
  if(!s.qr.expiresAt)return "—";
  const ms=s.qr.expiresAt-s.now;
  if(ms<=0)return t("جارِ التجديد…","Refreshing…");
  const m=Math.floor(ms/60000), sec=Math.floor((ms%60000)/1000);
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
function strip(){
  const dueTables=allDueTables();
  const totalDue=dueTables.reduce((a,n)=>a+tableDue(n),0);
  const dueOrders=s.orders.filter(o=>o.status==="served").length;
  const soon=s.qr.expiresAt && (s.qr.expiresAt-s.now)<60000;
  return `<div class="strip">
    <div class="stat c-brick"><div class="lbl"><i></i>${t("ترابيزات محتاجة تحصيل","Tables awaiting payment")}</div><b>${dueTables.length}</b></div>
    <div class="stat c-amber"><div class="lbl"><i></i>${t("إجمالي المطلوب تحصيله","Total due now")}</div><b>${money(totalDue)}</b></div>
    <div class="stat c-sage"><div class="lbl"><i></i>${t("عدد الطلبات المستحقة","Orders awaiting payment")}</div><b>${dueOrders}</b></div>
    <div class="qr-card">
      <div class="qr-info">
        <div class="lbl"><i></i>${t("كود الدفع الكاش","Cash-payment code")}</div>
        ${s.qr.loading?`<div class="qr-code loading">${t("جارِ التحميل…","Loading…")}</div>`
          :`<div class="qr-code tnum">${s.qr.code||"—"}</div>
            <div class="qr-meta">
              <span class="qr-until">${t("سارٍ لحد الساعة","Valid until")} <b>${clockTime(s.qr.expiresAt)}</b></span>
              <span class="qr-count${soon?" warn":""}" id="qrCount">${ICONS.clock}<span class="tnum">${fmtCountdown()}</span></span>
            </div>
            <div class="qr-bar"><div class="qr-bar-fill${soon?" warn":""}" id="qrBar" style="width:${qrProgress()}%"></div></div>`}
      </div>
      <div class="qr-box" id="qrBox"></div>
    </div>
  </div>`;
}
function tile(n){
  const state=tableState(n);
  const due=state==="due"?tableDue(n):0;
  const selected=s.selectedTable===n?" selected":"";
  const label=state==="due"?t("جاهزة للتحصيل","Ready to collect"):state==="active"?t("عليها طلب","Order placed"):t("متاحة","Available");
  return `<button class="tile ${state}${selected}" data-table="${n}">
    <div class="num">${n}</div>
    <div class="status"><i></i>${label}</div>
    ${state==="due"?`<div class="amt tnum">${money(due)}</div>`:""}
  </button>`;
}
function tablesSection(){
  const tiles=Array.from({length:CONFIG.TABLES},(_,i)=>i+1).map(tile).join("");
  return `<div class="section-title">
      <h2>${t("الترابيزات","Tables")}</h2>
      <div class="legend">
        <span class="free"><i></i>${t("متاحة","Available")}</span>
        <span class="active"><i></i>${t("عليها طلب","Order placed")}</span>
        <span class="due"><i></i>${t("جاهزة للتحصيل","Ready to collect")}</span>
      </div>
    </div>
    <div class="grid">${s.loading?`<div class="empty-note">${t("جارِ التحميل…","Loading…")}</div>`:tiles}</div>`;
}
function drawer(){
  const n=s.selectedTable;
  const open=s.drawerOpen&&n;
  if(!n) return `<div class="scrim"></div><div class="drawer"></div>`;
  const os=ordersFor(n);
  const due=tableDue(n);
  const hasDue=os.some(o=>o.status==="served");
  const body=os.length?os.map(o=>{
    const items=(o.order_items||[]).map(i=>`<div class="item-row"><span>${i.name_ar||i.name||i.name_en}</span><b>×${i.quantity}</b></div>`).join("");
    return `<div class="order-block">
      <div class="oh"><span class="badge ${o.status==='served'?'served':'active'}">${o.status==='served'?t('جاهز للدفع','Ready to pay'):t('جاري التحضير','In progress')}</span><span class="tnum">${money(o.total)}</span></div>
      ${items||`<div class="item-row">${t("لا توجد تفاصيل","No item details")}</div>`}
    </div>`;
  }).join(""):`<div class="drawer-empty">${t("مفيش طلبات مفتوحة على الترابيزة دي دلوقتي","No open orders on this table right now")}</div>`;
  return `<div class="scrim${open?" open":""}" id="scrim"></div>
  <div class="drawer${open?" open":""}">
    <div class="drawer-head">
      <div><h3>${t("ترابيزة","Table")} ${n}</h3><div class="st">${os.length} ${t("طلب","order(s)")}</div></div>
      <button class="drawer-close" id="drawerClose">${ICONS.close}</button>
    </div>
    <div class="drawer-body">${body}</div>
    ${hasDue?`<div class="drawer-foot">
      <div class="drawer-total"><span>${t("الإجمالي المطلوب","Total due")}</span><span class="tnum">${money(due)}</span></div>
      <button class="btn pay" id="drawerPay">${ICONS.check}${t("تسجيل الدفع","Mark table as paid")}</button>
    </div>`:""}
  </div>`;
}
function main(){
  return header()+`<main class="container">
    ${s.error?`<div class="banner">${ICONS.warn}<span>${t("حصل خطأ:","Error:")} ${s.error}</span><button class="x" id="dismissErr">${ICONS.close}</button></div>`:""}
    ${strip()}
    ${tablesSection()}
  </main>
  <footer>RestoFlow Cashier</footer>${drawer()}`;
}
function renderQRCode(){
  const box=document.getElementById("qrBox");
  if(!box || !s.qr.code)return;
  box.innerHTML="";
  new QRCode(box,{text:s.qr.code,width:80,height:80});
}
function bind(){
  document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});
  document.getElementById("themeToggle")?.addEventListener("click",()=>{
    s.theme=s.theme==="dark"?"light":"dark"; localStorage.setItem("rf_theme",s.theme); render();
  });
  document.getElementById("dismissErr")?.addEventListener("click",()=>{s.error=null;render()});
  document.querySelectorAll("[data-table]").forEach(b=>{
    b.onclick=()=>{ s.selectedTable=Number(b.dataset.table); s.drawerOpen=true; render(); };
  });
  document.getElementById("drawerClose")?.addEventListener("click",()=>{ s.drawerOpen=false; render(); });
  document.getElementById("scrim")?.addEventListener("click",()=>{ s.drawerOpen=false; render(); });
  document.getElementById("drawerPay")?.addEventListener("click",(e)=>{
    e.target.disabled=true; e.target.textContent=t("جارِ التسجيل…","Saving…");
    markTablePaid(s.selectedTable);
  });
}
function render(){
  document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";
  document.documentElement.setAttribute("data-theme",s.theme);
  document.getElementById("app").innerHTML=main();
  bind();
  renderQRCode();
}

async function init(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
    await Promise.all([ensureHourlyQR(),fetchOrders()]);
    let debounce=null;
    s.sb.channel("rf-cashier-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>{
        clearTimeout(debounce); debounce=setTimeout(fetchOrders,500);
      })
      .subscribe();
  }else{
    render();
  }
  // once a second: tick the countdown text + progress bar; only trigger
  // a full QR refresh + re-render when the current code actually expires
  setInterval(()=>{
    s.now=new Date();
    if(s.qr.expiresAt && s.now>=s.qr.expiresAt){ ensureHourlyQR(); return; }
    const bar=document.getElementById("qrBar");
    const warn=s.qr.expiresAt && (s.qr.expiresAt-s.now)<60000;
    if(bar){ bar.style.width=qrProgress()+"%"; bar.classList.toggle("warn",warn); }
    const cnt=document.getElementById("qrCount");
    if(cnt){ cnt.innerHTML=`${ICONS.clock}<span class="tnum">${fmtCountdown()}</span>`; cnt.classList.toggle("warn",warn); }
  },1000);
}

init();
</script>
</body>
</html>
