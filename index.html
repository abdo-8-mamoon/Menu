<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318"><title>RestoFlow — نظام المطعم الذكي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#707070;--line:#e8e5df;--accent:#b78635;--dark:#111318;--good:#1d8a58;--shadow:0 18px 50px #1717170e}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#ffffffeb;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 4vw;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#d8b36a,#8c5f20);display:grid;place-items:center;color:#fff;font-size:21px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:11px}.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.gold{background:var(--accent);color:#fff;border-color:var(--accent)}.hero{min-height:330px;padding:55px 7vw;display:flex;align-items:center;background:radial-gradient(circle at 15% 30%,#d9bc7c22,transparent 34%),linear-gradient(120deg,#14161b,#24231f);color:#fff}.hero h1{font-size:clamp(34px,6vw,68px);line-height:1.03;margin:0 0 16px}.hero p{max-width:650px;color:#e8e5de;font-size:18px;line-height:1.8}.badge{display:inline-block;border:1px solid #ffffff30;border-radius:999px;padding:7px 12px;color:#e7c982;margin-bottom:14px}.container{max-width:1250px;margin:auto;padding:28px 4vw}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 20px}.section-title h2{margin:0;font-size:28px}.muted{color:var(--muted)}.categories{display:flex;gap:9px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;padding:9px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px}.chip.active{background:var(--dark);color:#fff}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.food{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.food:hover{transform:translateY(-3px)}.food img{width:100%;height:170px;object-fit:cover}.food-body{padding:15px}.food h3{margin:0 0 7px}.price{font-weight:900;color:#8d6425;font-size:18px}.food-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.cart{position:fixed;left:22px;bottom:22px;z-index:30;background:var(--dark);color:#fff;border:0;border-radius:18px;padding:13px 17px;box-shadow:0 15px 40px #0003}.cart span{background:var(--accent);border-radius:999px;padding:3px 7px;margin-right:6px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#fff,#faf9f5)}.stat b{display:block;font-size:31px;margin-top:7px}.orders{display:grid;gap:12px}.order{border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px}.s-new{background:#fff1d8;color:#9b6410}.s-prep{background:#e9efff;color:#365aa3}.s-ready{background:#e4f7ed;color:#167045}.s-served{background:#eee;color:#555}.s-paid{background:#e5f8ed;color:#167045}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:center;padding:18px}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px}.close{float:left;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.cart-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px}.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.step{height:8px;border-radius:9px;background:#e5e2dc}.step.on{background:var(--accent)}.manager-head{background:linear-gradient(120deg,#14161b,#2a2925);color:#fff;border-radius:22px;padding:25px;margin-bottom:18px}.manager-head h1{margin:0 0 8px}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.table-card{border:1px solid var(--line);padding:14px;border-radius:15px;text-align:center;background:#fff}footer{padding:35px 4vw;color:var(--muted);text-align:center}@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.hero{min-height:290px;padding:40px 5vw}.order{grid-template-columns:1fr}}@media(max-width:480px){.food img{height:145px}.container{padding:22px 4vw}}
</style></head><body><div id="app"></div>
<script>
const CONFIG={SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co/rest/v1/",SUPABASE_ANON_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",RESTAURANT_NAME:"RestoFlow",CURRENCY:"ج.م",TABLES:30,DEFAULT_LANGUAGE:"ar"};
const MENU=[
{id:1,name_ar:"برجر كلاسيك",name_en:"Classic Burger",cat:"burgers",price:185,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85"},
{id:2,name_ar:"تشيز برجر",name_en:"Cheese Burger",cat:"burgers",price:215,img:"https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=900&q=85"},
{id:3,name_ar:"بيتزا مارغريتا",name_en:"Margherita Pizza",cat:"pizza",price:190,img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=85"},
{id:4,name_ar:"بيتزا بيبروني",name_en:"Pepperoni Pizza",cat:"pizza",price:230,img:"https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=900&q=85"},
{id:5,name_ar:"باستا ألفريدو",name_en:"Alfredo Pasta",cat:"pasta",price:205,img:"https://images.unsplash.com/photo-1645112411341-6c4fd023714a?auto=format&fit=crop&w=900&q=85"},
{id:6,name_ar:"فراخ مشوية",name_en:"Grilled Chicken",cat:"mains",price:260,img:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=85"},
{id:7,name_ar:"سيزر سالاد",name_en:"Caesar Salad",cat:"salads",price:145,img:"https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=900&q=85"},
{id:8,name_ar:"تشيز كيك",name_en:"Cheesecake",cat:"desserts",price:120,img:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=900&q=85"},
{id:9,name_ar:"مولتن كيك",name_en:"Molten Cake",cat:"desserts",price:135,img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85"},
{id:10,name_ar:"عصير مانجو",name_en:"Mango Juice",cat:"drinks",price:75,img:"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=900&q=85"}];
const CAT={all:["الكل","All"],burgers:["برجر","Burgers"],pizza:["بيتزا","Pizza"],pasta:["مكرونة","Pasta"],mains:["رئيسي","Mains"],salads:["سلطات","Salads"],desserts:["حلويات","Desserts"],drinks:["مشروبات","Drinks"]};
let s={lang:CONFIG.DEFAULT_LANGUAGE,menu:MENU,cat:"all",cart:[],orders:[],table:Number(new URLSearchParams(location.search).get("table"))||null,manager:new URLSearchParams(location.search).get("manager")==="1",dark:false,sb:null};
const t=(a,e)=>s.lang==="ar"?a:e, money=n=>`${Number(n).toLocaleString(s.lang==="ar"?"ar-EG":"en-US")} ${CONFIG.CURRENCY}`, name=x=>s.lang==="ar"?x.name_ar:x.name_en;
async function init(){if(!CONFIG.SUPABASE_URL.startsWith("YOUR_")&&!CONFIG.SUPABASE_ANON_KEY.startsWith("YOUR_")){s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);await loadMenu();await loadOrders();s.sb.channel("rf").on("postgres_changes",{event:"*",schema:"public",table:"orders"},loadOrders).on("postgres_changes",{event:"*",schema:"public",table:"menu_items"},loadMenu).subscribe()}render()}
async function loadMenu(){if(!s.sb)return;const r=await s.sb.from("menu_items").select("*").eq("active",true).order("sort_order");if(r.data?.length)s.menu=r.data;render()}
async function loadOrders(){if(!s.sb)return;const r=await s.sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);if(r.data)s.orders=r.data;render()}
const header=()=>`<header class="top"><div class="brand"><div class="logo">R</div><div>${CONFIG.RESTAURANT_NAME}<small class="muted" style="display:block;font-weight:400">${t("تجربة مطعم أذكى","Smarter restaurant experience")}</small></div></div><div class="actions"><button class="btn" id="lang">${s.lang==="ar"?"EN":"عربي"}</button><button class="btn" id="theme">${s.dark?"☀️":"🌙"}</button>${s.manager?`<button class="btn primary" id="customer">واجهة الزبون</button>`:""}</div></header>`;
function customer(){return header()+`<section class="hero"><div><span class="badge">TABLE ${s.table||"—"} • ${t("اطلب من موبايلك","ORDER FROM YOUR PHONE")}</span><h1>${t("منيو المطعم<br>بين إيديك.","Your menu.<br>In your hands.")}</h1><p>${t("اختار أكلك، عدّل طلبك، تابع حالة المطبخ، وشوف الفاتورة والدفع — كل ده من نفس الـQR.","Choose, customize, track, view your bill and pay — all from the same QR.")}</p></div></section><main class="container"><div class="section-title"><div><h2>${t("المنيو","Menu")}</h2><div class="muted">${t("طازة، سريع، وعلى مزاجك","Fresh, fast, your way")}</div></div><button class="btn" id="orders">طلباتي</button></div><div class="categories">${Object.entries(CAT).map(([k,v])=>`<button class="chip ${s.cat===k?"active":""}" data-cat="${k}">${t(v[0],v[1])}</button>`).join("")}</div><div class="menu" style="margin-top:18px">${s.menu.filter(x=>s.cat==="all"||x.cat===s.cat).map(food).join("")}</div></main>${s.cart.length?`<button class="cart" id="cart">🛒 ${t("السلة","Cart")} <span>${s.cart.reduce((a,x)=>a+x.qty,0)}</span></button>`:""}<footer>RestoFlow • ${t("نظام طلبات المطاعم","Restaurant ordering system")}</footer>`}
function food(x){return `<article class="food"><img src="${x.img||x.image_url||""}" alt=""><div class="food-body"><h3>${name(x)}</h3><div class="muted">${x.description_ar||x.description_en||t("اختيار شهي من الشيف","A delicious chef selection")}</div><div class="food-row"><span class="price">${money(x.price)}</span><button class="btn gold" data-add="${x.id}">+ ${t("إضافة","Add")}</button></div></div></article>`}
function manager(){let active=s.orders.filter(o=>!["paid","served"].includes(o.status)).length,rev=s.orders.filter(o=>o.status==="paid").reduce((a,o)=>a+Number(o.total||0),0);return header()+`<main class="container"><section class="manager-head"><span class="badge">${t("لوحة تحكم المدير","MANAGER DASHBOARD")}</span><h1>${t("كل المطعم قدامك.","Your restaurant, at a glance.")}</h1><p>${t("بيانات لحظية مع Supabase + تحديث دوري كل 5 دقائق.","Realtime with Supabase + a 5-minute refresh cycle.")}</p></section><div class="grid4"><div class="stat">👥 ${t("الطلبات اليوم","Today's orders")}<b>${s.orders.length}</b></div><div class="stat">🔥 ${t("طلبات المطبخ","Kitchen queue")}<b>${active}</b></div><div class="stat">💰 ${t("المبيعات المدفوعة","Paid sales")}<b>${money(rev)}</b></div><div class="stat">🪑 ${t("الترابيزات","Tables")}<b>30</b></div></div><div class="split" style="margin-top:18px"><section class="panel"><div class="section-title"><h2>${t("المطبخ","Kitchen")}</h2><span class="muted">${t("تحديث مباشر","Live")}</span></div><div class="orders">${(s.orders.length?s.orders:[{id:"DEMO-1042",table_number:7,total:420,status:"preparing",order_items:[{name:"Cheese Burger",quantity:2}]}]).map(orderCard).join("")}</div></section><section class="panel"><div class="section-title"><h2>${t("الترابيزات","Tables")}</h2></div><div class="table-grid">${Array.from({length:30},(_,i)=>`<div class="table-card"><strong>${t("ترابيزة","Table")} ${i+1}</strong><br><small class="muted">${s.orders.some(o=>Number(o.table_number)===i+1&&!["paid","served"].includes(o.status))?t("نشطة","Active"):t("متاحة","Available")}</small></div>`).join("")}</div></section></div><section class="panel"><h2>${t("QR Codes","QR Codes")}</h2><p class="muted">${t("في مجلد qr_codes يوجد QR مستقل لكل ترابيزة وQR خاص بالمدير.","The qr_codes folder contains one QR per table plus a manager QR.")}</p></section></main><footer>RestoFlow Manager • ${t("يتحدث كل 5 دقائق","Refreshes every 5 minutes")}</footer>`}
function orderCard(o){let l={new:["جديد","New","s-new"],preparing:["قيد التحضير","Preparing","s-prep"],ready:["جاهز","Ready","s-ready"],served:["تم التقديم","Served","s-served"],paid:["مدفوع","Paid","s-paid"]}[o.status]||["جديد","New","s-new"];return `<div class="order"><div><strong>#${o.id} • ${t("ترابيزة","Table")} ${o.table_number||"—"}</strong><div class="muted">${(o.order_items||[]).map(i=>`${i.name||i.name_ar||"Item"} × ${i.quantity}`).join(" • ")}</div></div><div><span class="status ${l[2]}">${t(l[0],l[1])}</span><div style="margin-top:8px">${money(o.total||0)}</div></div></div>`}
function render(){document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";document.getElementById("app").innerHTML=s.manager?manager():customer();bind()}
function bind(){document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});document.getElementById("theme")?.addEventListener("click",()=>{s.dark=!s.dark;document.body.style.filter=s.dark?"invert(.92) hue-rotate(180deg)":"none";render()});document.getElementById("customer")?.addEventListener("click",()=>{s.manager=false;render()});document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{s.cat=b.dataset.cat;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(+b.dataset.add));document.getElementById("cart")?.addEventListener("click",cartModal);document.getElementById("orders")?.addEventListener("click",ordersModal)}
function add(id){let f=s.menu.find(x=>+x.id===id),q=s.cart.find(x=>+x.id===id);q?q.qty++:s.cart.push({id,qty:1});render()}
function modal(content){let d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="modal-card"><button class="close">×</button>${content}</div>`;d.querySelector(".close").onclick=()=>d.remove();d.onclick=e=>e.target===d&&d.remove();document.body.appendChild(d);return d}
function cartModal(){let d=modal(`<h2>${t("سلة الطلب","Your order")}</h2><div>${s.cart.map((x,i)=>{let f=s.menu.find(m=>+m.id===+x.id);return `<div class="cart-item"><span><b>${name(f)}</b><br>${money(f.price)} × ${x.qty}</span><span class="qty"><button data-dec="${i}">−</button>${x.qty}<button data-inc="${i}">+</button></span></div>`}).join("")}</div><button class="btn gold" style="width:100%;margin-top:16px" id="send">${t("إرسال للمطبخ","Send to kitchen")}</button>`);d.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{s.cart[+b.dataset.inc].qty++;d.remove();cartModal()});d.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{let i=+b.dataset.dec;s.cart[i].qty--;if(s.cart[i].qty<=0)s.cart.splice(i,1);d.remove();render();if(s.cart.length)cartModal()});d.querySelector("#send").onclick=()=>place(d)}
async function place(d){if(!s.table)return alert(t("هذا الرابط ليس مربوطاً بترابيزة.","This link is not assigned to a table."));let items=s.cart.map(x=>{let f=s.menu.find(m=>+m.id===+x.id);return{menu_item_id:f.id,name:f.name_en||f.name_ar,name_ar:f.name_ar,name_en:f.name_en,price:f.price,quantity:x.qty}}),total=items.reduce((a,i)=>a+i.price*i.quantity,0),o={id:"LOCAL-"+Date.now(),table_number:s.table,total,status:"new",order_items:items};if(s.sb){let r=await s.sb.from("orders").insert({table_number:s.table,total,status:"new"}).select().single();if(!r.error){o.id=r.data.id;await s.sb.from("order_items").insert(items.map(i=>({...i,order_id:o.id})))}}s.orders.unshift(o);s.cart=[];d.remove();tracking(o);render()}
function tracking(o){let d=modal(`<h2>${t("طلبك وصل للمطبخ 🔥","Your order is in the kitchen 🔥")}</h2><p>#${o.id} • ${t("ترابيزة","Table")} ${o.table_number}</p><div class="track"><i class="step on"></i><i class="step"></i><i class="step"></i><i class="step"></i></div><h3>${t("تم استلام الطلب","Order received")}</h3><button class="btn gold" id="bill">${t("عرض الفاتورة","View bill")}</button>`);d.querySelector("#bill").onclick=()=>{d.remove();bill(o)}}
function ordersModal(){let os=s.orders.filter(o=>+o.table_number===+s.table);modal(`<h2>${t("طلبات الترابيزة","Table orders")}</h2>${os.length?os.map(o=>`<div class="panel"><b>#${o.id}</b><p>${t("الحالة","Status")}: ${o.status}</p><strong>${money(o.total)}</strong></div>`).join(""):`<p class="muted">${t("لا توجد طلبات حالياً.","No orders yet.")}</p>`}`)}
function bill(o){modal(`<h2>🧾 ${t("الفاتورة","Bill")}</h2><div class="panel">${(o.order_items||[]).map(i=>`<div class="cart-item"><span>${i.name_ar||i.name} × ${i.quantity}</span><b>${money(i.price*i.quantity)}</b></div>`).join("")}<div style="display:flex;justify-content:space-between;margin-top:15px;font-size:20px"><b>${t("الإجمالي","Total")}</b><b>${money(o.total)}</b></div></div><h3>${t("طريقة الدفع","Payment method")}</h3><div class="actions"><button class="btn">💵 ${t("كاش","Cash")}</button><button class="btn">💳 ${t("بطاقة","Card")}</button><button class="btn">📱 ${t("محفظة","Wallet")}</button><button class="btn">🌐 ${t("أونلاين","Online")}</button></div><p class="muted">${t("ربط الدفع الحقيقي يحتاج حساب التاجر وBackend/Edge Function. لا تضع مفاتيح الدفع السرية داخل index.html.","Real payment needs merchant credentials and a backend/Edge Function. Never put payment secrets in this public HTML.")}</p>`)}
setInterval(()=>{if(s.sb)loadOrders()},300000);init();
</script></body></html>
