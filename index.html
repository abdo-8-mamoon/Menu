<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>RestoFlow — نظام المطعم الذكي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#707070;--line:#e8e5df;--accent:#b78635;--dark:#111318;--good:#1d8a58;--shadow:0 18px 50px #1717170e}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#ffffffeb;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 4vw;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#d8b36a,#8c5f20);display:grid;place-items:center;color:#fff;font-size:21px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:11px}.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.gold{background:var(--accent);color:#fff;border-color:var(--accent)}
.hero{min-height:330px;padding:55px 7vw;display:flex;align-items:center;background:radial-gradient(circle at 15% 30%,#d9bc7c22,transparent 34%),linear-gradient(120deg,#14161b,#24231f);color:#fff}.hero h1{font-size:clamp(34px,6vw,68px);line-height:1.03;margin:0 0 16px}.hero p{max-width:650px;color:#e8e5de;font-size:18px;line-height:1.8}.badge{display:inline-block;border:1px solid #ffffff30;border-radius:999px;padding:7px 12px;color:#e7c982;margin-bottom:14px}
.container{max-width:1250px;margin:auto;padding:28px 4vw}.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 20px}.section-title h2{margin:0;font-size:28px}.muted{color:var(--muted)}
.categories{display:flex;gap:9px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;padding:9px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px}.chip.active{background:var(--dark);color:#fff}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.food{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.food:hover{transform:translateY(-3px)}.food img{width:100%;height:170px;object-fit:cover}.food-body{padding:15px}.food h3{margin:0 0 7px}.price{font-weight:900;color:#8d6425;font-size:18px}.food-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.cart{position:fixed;left:22px;bottom:22px;z-index:30;background:var(--dark);color:#fff;border:0;border-radius:18px;padding:13px 17px;box-shadow:0 15px 40px #0003}.cart span{background:var(--accent);border-radius:999px;padding:3px 7px;margin-right:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#fff,#faf9f5)}.stat b{display:block;font-size:31px;margin-top:7px}
.orders{display:grid;gap:12px}.order{border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px}.s-new{background:#fff1d8;color:#9b6410}.s-prep{background:#e9efff;color:#365aa3}.s-ready{background:#e4f7ed;color:#167045}.s-served{background:#eee;color:#555}.s-paid{background:#e5f8ed;color:#167045}
.order-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.order-actions .btn{padding:7px 10px;font-size:13px}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:center;padding:18px}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:24px;padding:22px}.close{float:left;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.cart-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.step{height:8px;border-radius:9px;background:#e5e2dc}.step.on{background:var(--accent)}
.manager-head{background:linear-gradient(120deg,#14161b,#2a2925);color:#fff;border-radius:22px;padding:25px;margin-bottom:18px}.manager-head h1{margin:0 0 8px}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.table-card{border:1px solid var(--line);padding:14px;border-radius:15px;text-align:center;background:#fff}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.qr-card{border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center;background:#fff}.qr-box{display:grid;place-items:center;min-height:150px;margin:8px 0}.qr-link{font-size:12px;word-break:break-all;color:#555}.kitchen-empty{text-align:center;padding:40px;color:var(--muted)}

.invoice{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.invoice-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px dashed var(--line);padding-bottom:15px;margin-bottom:12px}.invoice-brand{font-size:24px;font-weight:900}.invoice-meta{text-align:left;color:var(--muted);font-size:13px;line-height:1.8}.invoice-table{width:100%;border-collapse:collapse;margin-top:8px}.invoice-table th,.invoice-table td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}.invoice-table th{font-size:12px;color:var(--muted)}.invoice-total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin-top:15px;padding-top:12px;border-top:2px solid var(--dark)}.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pay-btn{padding:11px 8px;border:1px solid var(--line);background:#fff;border-radius:12px}.pay-btn.selected{background:var(--dark);color:#fff;border-color:var(--dark)}.invoice-actions{display:flex;gap:8px;margin-top:15px}.invoice-actions .btn{flex:1}.paid-box{background:#e4f7ed;color:#167045;border-radius:12px;padding:12px;text-align:center;font-weight:800;margin-top:12px}@media(max-width:600px){.pay-grid{grid-template-columns:1fr 1fr}.invoice-head{flex-direction:column}.invoice-meta{text-align:right}.invoice-table th:nth-child(2),.invoice-table td:nth-child(2){display:none}}
footer{padding:35px 4vw;color:var(--muted);text-align:center}
@media(max-width:800px){.grid4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.hero{min-height:290px;padding:40px 5vw}.order{grid-template-columns:1fr}}
@media(max-width:480px){.food img{height:145px}.container{padding:22px 4vw}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const CONFIG={
  SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",
  RESTAURANT_NAME:"RestoFlow", CURRENCY:"ج.م", TABLES:30, DEFAULT_LANGUAGE:"ar"
};

const MENU=[
{id:1,name_ar:"برجر كلاسيك",name_en:"Classic Burger",cat:"burgers",price:185,img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85"},
{id:2,name_ar:"تشيز برجر",name_en:"Cheese Burger",cat:"burgers",price:215,img:"https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=900&q=85"},
{id:3,name_ar:"بيتزا مارغريتا",name_en:"Margherita Pizza",cat:"pizza",price:190,img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=85"},
{id:4,name_ar:"بيتزا بيبروني",name_en:"Pepperoni Pizza",cat:"pizza",price:230,img:"https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=900&q=85"},
{id:5,name_ar:"باستا ألفريدو",name_en:"Alfredo Pasta",cat:"pasta",price:205,img:"https://images.unsplash.com/photo-1645112411341-6c4fd023714a?auto=format&fit=crop&w=900&q=85"},
{id:6,name_ar:"فراخ مشوية",name_en:"Grilled Chicken",cat:"mains",price:260,img:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=85"},
{id:7,name_ar:"سيزر سالاد",name_en:"Caesar Salad",cat:"salads",price:145,img:"https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=900&q=85"},
{id:8,name_ar:"تشيز كيك",name_en:"Cheesecake",cat:"desserts",price:120,img:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=900&q=85"},
{id:9,name_ar:"مولتن كيك",name_en:"Molten Cake",cat:"desserts",price:135,img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85"},
{id:10,name_ar:"عصير مانجو",name_en:"Mango Juice",cat:"drinks",price:75,img:"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=900&q=85"}
];
const CAT={all:["الكل","All"],burgers:["برجر","Burgers"],pizza:["بيتزا","Pizza"],pasta:["مكرونة","Pasta"],mains:["رئيسي","Mains"],salads:["سلطات","Salads"],desserts:["حلويات","Desserts"],drinks:["مشروبات","Drinks"]};

const params=new URLSearchParams(location.search);
let s={
  lang:CONFIG.DEFAULT_LANGUAGE,menu:MENU,cat:"all",cart:[],orders:[],
  table:Number(params.get("table"))||null,
  manager:params.get("manager")==="1",
  kitchen:params.get("kitchen")==="1",
  dark:false,sb:null,currentOrder:null
};

const t=(a,e)=>s.lang==="ar"?a:e;
const money=n=>`${Number(n||0).toLocaleString(s.lang==="ar"?"ar-EG":"en-US")} ${CONFIG.CURRENCY}`;
const name=x=>s.lang==="ar"?(x.name_ar||x.name||"Item"):(x.name_en||x.name||"Item");

async function init(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
    await loadMenu();
    await loadOrders();
    s.sb.channel("rf-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{await loadOrders()})
      .on("postgres_changes",{event:"*",schema:"public",table:"order_items"},async()=>{await loadOrders()})
      .on("postgres_changes",{event:"*",schema:"public",table:"menu_items"},async()=>{await loadMenu()})
      .subscribe();
  }
  render();
  setTimeout(handlePaymentReturn, 300);
}

async function loadMenu(){
  if(!s.sb)return;
  const r=await s.sb.from("menu_items").select("*").eq("active",true).order("sort_order");
  if(!r.error && r.data && r.data.length)s.menu=r.data;
}

async function loadOrders(){
  if(!s.sb)return;
  let q=s.sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);
  if(!s.manager && s.table) q=q.eq("table_number",s.table);
  const r=await q;
  if(!r.error && r.data)s.orders=r.data;
  render();
}

function header(){
  return `<header class="top">
    <div class="brand"><div class="logo">R</div><div>${CONFIG.RESTAURANT_NAME}
      <small class="muted" style="display:block;font-weight:400">${t("تجربة مطعم أذكى","Smarter restaurant experience")}</small>
    </div></div>
    <div class="actions">
      <button class="btn" id="lang">${s.lang==="ar"?"EN":"عربي"}</button>
      <button class="btn" id="theme">${s.dark?"☀️":"🌙"}</button>
      ${s.manager||s.kitchen?`<button class="btn" id="customer">واجهة الزبون</button>`:""}
    </div>
  </header>`;
}

function customer(){
  return header()+`
  <section class="hero"><div>
    <span class="badge">TABLE ${s.table||"—"} • ${t("اطلب من موبايلك","ORDER FROM YOUR PHONE")}</span>
    <h1>${t("منيو المطعم<br>بين إيديك.","Your menu.<br>In your hands.")}</h1>
    <p>${t("اختار أكلك، عدّل طلبك، تابع حالة المطبخ، وشوف الفاتورة — كل ده من نفس الـQR.","Choose, customize, track and view your bill — all from the same QR.")}</p>
  </div></section>
  <main class="container">
    <div class="section-title"><div><h2>${t("المنيو","Menu")}</h2><div class="muted">${t("طازة، سريع، وعلى مزاجك","Fresh, fast, your way")}</div></div>
      <button class="btn" id="orders">${t("طلباتي","My orders")}</button>
    </div>
    <div class="categories">${Object.entries(CAT).map(([k,v])=>`<button class="chip ${s.cat===k?"active":""}" data-cat="${k}">${t(v[0],v[1])}</button>`).join("")}</div>
    <div class="menu" style="margin-top:18px">${s.menu.filter(x=>s.cat==="all"||x.cat===s.cat).map(food).join("")}</div>
  </main>
  ${s.cart.length?`<button class="cart" id="cart">🛒 ${t("السلة","Cart")} <span>${s.cart.reduce((a,x)=>a+x.qty,0)}</span></button>`:""}
  <footer>RestoFlow • ${t("نظام طلبات المطاعم","Restaurant ordering system")}</footer>`;
}

function food(x){
  return `<article class="food"><img src="${x.img||x.image_url||""}" alt="">
    <div class="food-body"><h3>${name(x)}</h3>
    <div class="muted">${s.lang==="ar"?(x.description_ar||"اختيار شهي من الشيف"):(x.description_en||"A delicious chef selection")}</div>
    <div class="food-row"><span class="price">${money(x.price)}</span>
    <button class="btn gold" data-add="${x.id}">+ ${t("إضافة","Add")}</button></div></div>
  </article>`;
}

function kitchen(){
  const queue=s.orders.filter(o=>["new","preparing","ready"].includes(o.status));
  return header()+`<main class="container">
    <section class="manager-head"><span class="badge">${t("واجهة المطبخ","KITCHEN")}</span>
      <h1>${t("طلبات المطبخ","Kitchen orders")}</h1>
      <p>${t("الطلبات تظهر هنا مباشرة عند إرسالها من الزبون.","Orders appear here instantly when the customer sends them.")}</p>
    </section>
    <div class="grid4">
      <div class="stat">🆕 ${t("جديد","New")}<b>${s.orders.filter(o=>o.status==="new").length}</b></div>
      <div class="stat">🔥 ${t("تحضير","Preparing")}<b>${s.orders.filter(o=>o.status==="preparing").length}</b></div>
      <div class="stat">✅ ${t("جاهز","Ready")}<b>${s.orders.filter(o=>o.status==="ready").length}</b></div>
      <div class="stat">📦 ${t("إجمالي الطابور","Queue")}<b>${queue.length}</b></div>
    </div>
    <section class="panel" style="margin-top:18px"><div class="section-title"><h2>${t("الطلبات","Orders")}</h2><span class="muted">Live</span></div>
      <div class="orders">${queue.length?queue.map(orderCard).join(""):`<div class="kitchen-empty">${t("لا توجد طلبات في المطبخ حالياً.","No active kitchen orders.")}</div>`}</div>
    </section>
  </main><footer>RestoFlow Kitchen</footer>`;
}

function manager(){
  let active=s.orders.filter(o=>!["paid","served"].includes(o.status)).length;
  let rev=s.orders.filter(o=>o.status==="paid").reduce((a,o)=>a+Number(o.total||0),0);
  return header()+`<main class="container">
    <section class="manager-head"><span class="badge">${t("لوحة تحكم المدير","MANAGER DASHBOARD")}</span>
      <h1>${t("كل المطعم قدامك.","Your restaurant, at a glance.")}</h1>
      <p>${t("الطلبات والمطبخ والترابيزات وQR Codes في مكان واحد.","Orders, kitchen, tables and QR codes in one place.")}</p>
    </section>
    <div class="grid4">
      <div class="stat">👥 ${t("الطلبات","Orders")}<b>${s.orders.length}</b></div>
      <div class="stat">🔥 ${t("طلبات المطبخ","Kitchen queue")}<b>${active}</b></div>
      <div class="stat">💰 ${t("المبيعات المدفوعة","Paid sales")}<b>${money(rev)}</b></div>
      <div class="stat">🪑 ${t("الترابيزات","Tables")}<b>${CONFIG.TABLES}</b></div>
    </div>
    <section class="panel" style="margin-top:18px"><div class="section-title"><h2>${t("الطلبات","Orders")}</h2><span class="muted">Live</span></div>
      <div class="orders">${s.orders.length?s.orders.map(orderCard).join(""):`<div class="kitchen-empty">${t("لا توجد طلبات بعد.","No orders yet.")}</div>`}</div>
    </section>
    <section class="panel"><div class="section-title"><h2>${t("الترابيزات","Tables")}</h2></div>
      <div class="table-grid">${Array.from({length:CONFIG.TABLES},(_,i)=>`<div class="table-card"><strong>${t("ترابيزة","Table")} ${i+1}</strong><br><small class="muted">${s.orders.some(o=>Number(o.table_number)===i+1&&!["paid","served"].includes(o.status))?t("نشطة","Active"):t("متاحة","Available")}</small></div>`).join("")}</div>
    </section>
    <section class="panel"><div class="section-title"><h2>QR Codes</h2><button class="btn gold" id="showQR">${t("عرض كل الـQR","Show all QR codes")}</button></div>
      <p class="muted">${t("كل ترابيزة لها لينك مستقل. عند مسح الـQR يفتح المنيو مباشرة على رقم الترابيزة.","Each table has its own link. Scanning its QR opens the menu directly for that table.")}</p>
      <div id="qrArea"></div>
    </section>
  </main><footer>RestoFlow Manager</footer>`;
}

function orderCard(o){
  const l={new:["جديد","New","s-new"],preparing:["قيد التحضير","Preparing","s-prep"],ready:["جاهز","Ready","s-ready"],served:["تم التقديم","Served","s-served"],paid:["مدفوع","Paid","s-paid"]}[o.status]||["جديد","New","s-new"];
  let actions="";
  if(s.kitchen){
    if(o.status==="new")actions=`<button class="btn gold" data-status="${o.id}:preparing">${t("ابدأ التحضير","Start preparing")}</button>`;
    if(o.status==="preparing")actions=`<button class="btn gold" data-status="${o.id}:ready">${t("تم التجهيز","Mark ready")}</button>`;
    if(o.status==="ready")actions=`<button class="btn" data-status="${o.id}:served">${t("تم التقديم","Mark served")}</button>`;
  }else if(s.manager){
    if(o.status==="new")actions=`<button class="btn gold" data-status="${o.id}:preparing">${t("قيد التحضير","Preparing")}</button>`;
    if(o.status==="preparing")actions=`<button class="btn gold" data-status="${o.id}:ready">${t("جاهز","Ready")}</button>`;
    if(o.status==="ready")actions=`<button class="btn" data-status="${o.id}:served">${t("تم التقديم","Served")}</button>`;
    if(o.status==="served")actions=`<button class="btn" data-status="${o.id}:paid">${t("تم الدفع","Paid")}</button>`;
  }
  return `<div class="order"><div><strong>#${o.id} • ${t("ترابيزة","Table")} ${o.table_number||"—"}</strong>
    <div class="muted">${(o.order_items||[]).map(i=>`${i.name_ar||i.name||i.name_en||"Item"} × ${i.quantity}`).join(" • ")}</div>
    ${actions?`<div class="order-actions">${actions}</div>`:""}</div>
    <div><span class="status ${l[2]}">${t(l[0],l[1])}</span><div style="margin-top:8px">${money(o.total)}</div></div></div>`;
}

async function updateStatus(id,status){
  if(s.sb){
    const r=await s.sb.from("orders").update({status}).eq("id",id);
    if(r.error){alert(r.error.message);return}
    await loadOrders();
  }else{
    const o=s.orders.find(x=>String(x.id)===String(id)); if(o)o.status=status;
    render();
  }
}

function bind(){
  document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});
  document.getElementById("theme")?.addEventListener("click",()=>{s.dark=!s.dark;document.body.style.filter=s.dark?"invert(.92) hue-rotate(180deg)":"none";render()});
  document.getElementById("customer")?.addEventListener("click",()=>{location.href=location.pathname+(s.table?`?table=${s.table}`:"")});
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{s.cat=b.dataset.cat;render()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(+b.dataset.add));
  document.querySelectorAll("[data-status]").forEach(b=>{const [id,status]=b.dataset.status.split(":");b.onclick=()=>updateStatus(id,status)});
  document.getElementById("cart")?.addEventListener("click",cartModal);
  document.getElementById("orders")?.addEventListener("click",ordersModal);
  document.getElementById("showQR")?.addEventListener("click",renderQR);
}

function add(id){
  let f=s.menu.find(x=>+x.id===id); if(!f)return;
  let q=s.cart.find(x=>+x.id===id); q?q.qty++:s.cart.push({id,qty:1}); render();
}

function modal(content){
  let d=document.createElement("div");d.className="modal";
  d.innerHTML=`<div class="modal-card"><button class="close">×</button>${content}</div>`;
  d.querySelector(".close").onclick=()=>d.remove();
  d.onclick=e=>e.target===d&&d.remove();
  document.body.appendChild(d);return d;
}

function cartModal(){
  let d=modal(`<h2>${t("سلة الطلب","Your order")}</h2><div>${s.cart.map((x,i)=>{
    let f=s.menu.find(m=>+m.id===+x.id);
    return `<div class="cart-item"><span><b>${name(f)}</b><br>${money(f.price)} × ${x.qty}</span>
    <span class="qty"><button data-dec="${i}">−</button>${x.qty}<button data-inc="${i}">+</button></span></div>`;
  }).join("")}</div><button class="btn gold" style="width:100%;margin-top:16px" id="send">${t("إرسال للمطبخ","Send to kitchen")}</button>`);
  d.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{s.cart[+b.dataset.inc].qty++;d.remove();cartModal()});
  d.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{let i=+b.dataset.dec;s.cart[i].qty--;if(s.cart[i].qty<=0)s.cart.splice(i,1);d.remove();render();if(s.cart.length)cartModal()});
  d.querySelector("#send").onclick=()=>place(d);
}

async function place(d){
  if(!s.table)return alert(t("هذا الرابط ليس مربوطاً بترابيزة.","This link is not assigned to a table."));
  let items=s.cart.map(x=>{let f=s.menu.find(m=>+m.id===+x.id);return{
    menu_item_id:f.id,name:f.name_en||f.name_ar,name_ar:f.name_ar,name_en:f.name_en,price:f.price,quantity:x.qty
  }});
  let total=items.reduce((a,i)=>a+i.price*i.quantity,0);
  let o={id:"LOCAL-"+Date.now(),table_number:s.table,total,status:"new",order_items:items};

  if(s.sb){
    // orders.session_id is NOT NULL and references table_sessions(id),
    // so every order must belong to an open table session.
    let sessionId=null;

    const sr=await s.sb.from("table_sessions")
      .select("id")
      .eq("table_number",s.table)
      .eq("status","open")
      .order("opened_at",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(sr.error){
      alert("خطأ في جلب جلسة الترابيزة: "+sr.error.message);
      return;
    }

    if(sr.data){
      sessionId=sr.data.id;
    }else{
      const ns=await s.sb.from("table_sessions")
        .insert({table_number:s.table,status:"open"})
        .select("id")
        .single();

      if(ns.error){
        alert("خطأ في إنشاء جلسة الترابيزة: "+ns.error.message);
        return;
      }
      sessionId=ns.data.id;
    }

    const r=await s.sb.from("orders")
      .insert({table_number:s.table,session_id:sessionId,total,status:"new"})
      .select()
      .single();

    if(r.error){
      alert(r.error.message);
      return;
    }

    o.id=r.data.id;
    o.session_id=sessionId;

    const ri=await s.sb.from("order_items")
      .insert(items.map(i=>({...i,order_id:o.id})));

    if(ri.error){
      alert(ri.error.message);
      return;
    }
  }
  s.orders.unshift(o);s.cart=[];s.currentOrder=o;d.remove();tracking(o);render();
}

function tracking(o){
  let d=modal(`<h2 id="trackTitle">${t("طلبك وصل للمطبخ 🔥","Your order is in the kitchen 🔥")}</h2>
  <p>#${o.id} • ${t("ترابيزة","Table")} ${o.table_number}</p><div class="track" id="track"></div>
  <h3 id="trackStatus"></h3><button class="btn gold" id="bill">${t("عرض الفاتورة","View bill")}</button>`);
  drawTrack(d,o.status);
  d.querySelector("#bill").onclick=()=>{d.remove();bill(o)};
}

function drawTrack(d,status){
  const steps=["new","preparing","ready","served"];
  const idx=steps.indexOf(status);
  d.querySelector("#track").innerHTML=steps.map((_,i)=>`<i class="step ${i<=idx?"on":""}"></i>`).join("");
  const labels={new:["تم استلام الطلب","Order received"],preparing:["جاري التحضير","Preparing"],ready:["الطلب جاهز","Order ready"],served:["تم التقديم","Served"]};
  d.querySelector("#trackStatus").textContent=t(labels[status]?.[0]||"تم استلام الطلب",labels[status]?.[1]||"Order received");
}

    <h2>${t("طلبات الترابيزة","Table orders")}</h2>

function bill(o){
  const items=o.order_items||[];
  const subtotal=items.reduce((a,i)=>a+Number(i.price||0)*Number(i.quantity||0),0);
  const total=Number(o.total||subtotal);
  const paid=o.payment_status==="paid" || o.status==="paid";
  const created=o.created_at?new Date(o.created_at):new Date();

  const d=modal(`
    <div id="invoice" dir="${s.lang==="ar"?"rtl":"ltr"}" style="background:#fff;padding:4px">
      <div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-bottom:2px solid var(--line);padding-bottom:16px">
        <div>
          <div style="font-size:28px;font-weight:900">RestoFlow</div>
          <div class="muted">${t("فاتورة المطعم الذكي","Smart Restaurant Invoice")}</div>
        </div>
        <div style="text-align:${s.lang==="ar"?"left":"right"}">
          <b>${t("فاتورة رقم","Invoice")} #${o.id}</b><br>
          <span class="muted">${created.toLocaleString(s.lang==="ar"?"ar-EG":"en-US")}</span>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0">
        <div class="panel" style="margin:0">
          <span class="muted">${t("الترابيزة","Table")}</span>
          <strong style="display:block;font-size:22px">${o.table_number||s.table||"—"}</strong>
        </div>
        <div class="panel" style="margin:0">
          <span class="muted">${t("الحالة","Status")}</span>
          <strong style="display:block;font-size:18px">${paid?t("مدفوع ✓","Paid ✓"):t("غير مدفوع","Unpaid")}</strong>
        </div>
      </div>

      <div class="panel">
        ${items.length?items.map(i=>`
          <div class="cart-item">
            <div>
              <b>${i.name_ar||i.name||i.name_en||t("صنف","Item")}</b><br>
              <small class="muted">${money(i.price||0)} × ${i.quantity||0}</small>
            </div>
            <b>${money(Number(i.price||0)*Number(i.quantity||0))}</b>
          </div>
        `).join(""):`<p class="muted">${t("لا توجد تفاصيل للأصناف","No item details available")}</p>`}

        <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:23px">
          <b>${t("الإجمالي","Total")}</b>
          <b class="price">${money(total)}</b>
        </div>
      </div>

      ${paid?`
        <div style="padding:14px;border-radius:14px;background:#e5f8ed;color:#167045;font-weight:800;text-align:center">
          ✓ ${t("تم الدفع بنجاح","Payment completed successfully")}
        </div>
      `:`
        <h3>${t("اختار طريقة الدفع","Choose payment method")}</h3>
        <div class="actions" id="paymentMethods">
          <button class="btn" data-pay="cash">💵 ${t("كاش","Cash")}</button>
          <button class="btn" data-pay="card">💳 ${t("بطاقة","Card")}</button>
          <button class="btn" data-pay="wallet">📱 ${t("محفظة","Wallet")}</button>
          <button class="btn gold" data-pay="online">🌐 ${t("أونلاين","Online")}</button>
        </div>
        <div id="paymentNote" class="muted" style="margin-top:12px"></div>
      `}

      <div class="actions" style="margin-top:18px">
        <button class="btn primary" id="printInvoice">🖨️ ${t("طباعة الفاتورة","Print invoice")}</button>
        <button class="btn" id="closeInvoice">${t("إغلاق","Close")}</button>
      </div>
    </div>
  `);

  d.querySelector("#closeInvoice")?.addEventListener("click",()=>d.remove());

    w.document.write(`

      <head><meta charset="utf-8"><title>RestoFlow Invoice</title>
      <style>
        body{font-family:Tahoma,Arial,sans-serif;padding:30px;color:#151515}

function printInvoice(o){

  w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>RestoFlow Invoice #${o.id}</title><style>body{font-family:Arial,Tahoma,sans-serif;padding:30px;color:#111}h1{margin-bottom:4px}.meta{color:#666;line-height:1.8}.line{border-top:1px dashed #999;margin:20px 0}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:right}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:bold;margin-top:20px}@media print{body{padding:10px}}</style></head><body><h1>${CONFIG.RESTAURANT_NAME}</h1><div class="meta">${t("فاتورة طلب","Order invoice")} #${o.id}<br>${t("الترابيزة","Table")}: ${o.table_number||"—"}<br>${date.toLocaleString("ar-EG")}</div><div class="line"></div><table><thead><tr><th>${t("الصنف","Item")}</th><th>${t("الكمية","Qty")}</th><th>${t("سعر الوحدة","Unit")}</th><th>${t("الإجمالي","Total")}</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><span>${t("الإجمالي النهائي","Grand total")}</span><span>${Number(o.total||0).toLocaleString()} ${CONFIG.CURRENCY}</span></div><p style="text-align:center;margin-top:35px;color:#777">RestoFlow</p><script>window.onload=()=>window.print()<\/script></body></html>`);

async function confirmPayment(o,method,d){
  if(!method)return alert(t("اختار طريقة الدفع الأول.","Choose a payment method first."));
  const labels={cash:["كاش","Cash"],card:["بطاقة","Card"],wallet:["محفظة","Wallet"],online:["أونلاين","Online"]};
  if(method==="online")return alert(t("الدفع الأونلاين يحتاج بوابة دفع حقيقية. حالياً نقدر نسجل الطريقة فقط بعد التأكيد.","Online payment needs a real payment gateway. For now we can only record the selected method after confirmation."));
  if(s.sb){
    const r=await s.sb.from("orders").update({status:"paid",payment_method:method}).eq("id",o.id);
    if(r.error){
      const fallback=await s.sb.from("orders").update({status:"paid"}).eq("id",o.id);
      if(fallback.error)return alert(fallback.error.message);
    }
  }
  o.status="paid";o.payment_method=method;
  d.remove();
  bill(o);
  await loadOrders();
}



async function payOnline(o, d, btn, note){
  if(!s.sb){
    note.textContent=t("Supabase غير متصل.","Supabase is not connected.");
    return;
  }

  if(!o || !o.id){
    note.textContent=t("رقم الطلب غير موجود.","Order ID is missing.");
    return;
  }

  btn.disabled=true;
  note.className="payment-loading";
  note.textContent=t("جاري تجهيز صفحة الدفع الآمنة...","Preparing the secure payment page...");

  try{
    const {data,error}=await s.sb.functions.invoke("create-kashier-payment",{
      body:{order_id:o.id}
    });

    console.log("Payment initialization:",data);
    if(error) throw new Error(error.message||"Payment function failed");
    if(!data?.success || !data?.checkout_url){
      throw new Error(data?.error||"Payment checkout URL was not returned");
    }

    localStorage.setItem("restoflow_payment_order",String(o.id));
    localStorage.setItem("restoflow_payment_reference",String(data.reference||""));
    localStorage.setItem("restoflow_paymob_order",String(data.paymob_order_id||""));

    window.location.href=data.checkout_url;
  }catch(error){
    console.error("Online payment error:",error);
    btn.disabled=false;
    note.className="muted";
    note.textContent=error?.message||t("تعذر تجهيز الدفع.","Unable to start payment.");
  }
}

async function fetchOrderById(orderId){
  if(!s.sb || !orderId) return null;
  const {data,error}=await s.sb
    .from("orders")
    .select("*,order_items(*)")
    .eq("id",orderId)
    .maybeSingle();
  if(error){
    console.error("Payment return order error:",error);
    return null;
  }
  return data||null;
}

function paymentResultPage(order, state){
  const paid=state==="paid";
  const failed=state==="failed";
  const title=paid?t("تم الدفع بنجاح ✅","Payment successful ✅"):failed?t("لم يتم الدفع","Payment failed"):t("جاري تأكيد الدفع...","Confirming payment...");
  const text=paid
    ?t("تم تأكيد الدفع من Paymob. يمكنك طباعة الفاتورة الآن.","Paymob confirmed the payment. You can print your invoice now.")
    :failed
      ?t("عملية الدفع لم تكتمل. يمكنك المحاولة مرة أخرى.","The payment was not completed. You can try again.")
      :t("انتظر لحظات حتى يصل تأكيد الدفع من Paymob...","Please wait while Paymob confirms the payment...");

  const itemRows=(order?.order_items||[]).map(i=>`<div class="cart-item"><span>${i.name_ar||i.name||i.name_en||"Item"} × ${i.quantity}</span><b>${money(Number(i.price||0)*Number(i.quantity||0))}</b></div>`).join("");

  const d=modal(`
    <div style="text-align:center;padding:10px">
      <div style="font-size:56px;margin-bottom:8px">${paid?"✅":failed?"❌":"⏳"}</div>
      <h2 style="margin-bottom:8px">${title}</h2>
      <p class="muted">${text}</p>
      ${order?`<div class="panel" style="text-align:${s.lang==="ar"?"right":"left"}">
        <div class="section-title" style="margin:0 0 10px"><b>${t("الفاتورة","Invoice")} #${order.id}</b><span>${t("ترابيزة","Table")} ${order.table_number||"—"}</span></div>
        ${itemRows}
        <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin-top:14px"><span>${t("الإجمالي","Total")}</span><span class="price">${money(order.total)}</span></div>
      </div>`:""}
      <div class="actions" style="justify-content:center;margin-top:14px">
        ${paid&&order?`<button class="btn primary" id="printAfterPayment">🖨️ ${t("طباعة الفاتورة","Print invoice")}</button>`:""}
        ${failed&&order?`<button class="btn gold" id="retryPayment">↻ ${t("حاول مرة أخرى","Try again")}</button>`:""}
      </div>
    </div>
  `);

  if(paid&&order){
    d.querySelector("#printAfterPayment")?.addEventListener("click",()=>printInvoice(order));
  }
  if(failed&&order){
    d.querySelector("#retryPayment")?.addEventListener("click",()=>{d.remove();bill(order)});
  }
  return d;
}

async function handlePaymentReturn(){
  const paramsNow=new URLSearchParams(location.search);
  const isReturn=paramsNow.get("payment")==="return" || paramsNow.get("payment")==="success" || paramsNow.has("success");
  if(!isReturn || !s.sb) return;

  const urlOrderId=paramsNow.get("order_id") || paramsNow.get("merchant_order_id");
  const orderId=urlOrderId || localStorage.getItem("restoflow_payment_order");
  if(!orderId) return;

  // Give the server-to-server webhook a moment, then poll for the final status.
  let order=await fetchOrderById(orderId);
  let tries=0;
  while(order && order.payment_status!=="paid" && order.status!=="paid" && tries<12){
    if(order.payment_status==="failed") break;
    await new Promise(r=>setTimeout(r,1500));
    order=await fetchOrderById(orderId);
    tries++;
  }

  if(!order){
    paymentResultPage(null,"failed");
    return;
  }

  const state=(order.payment_status==="paid" || order.status==="paid")
    ?"paid"
    :(order.payment_status==="failed"?"failed":"pending");

  if(state==="pending"){
    const d=paymentResultPage(order,"pending");
    setTimeout(async()=>{
      d.remove();
      await handlePaymentReturn();
    },1500);
    return;
  }

  paymentResultPage(order,state);

  if(state==="paid"){
    // Store a clean state and remove payment flags from the URL.
    localStorage.removeItem("restoflow_payment_reference");
    localStorage.removeItem("restoflow_paymob_order");

    // Try automatic printing; if the browser blocks it, the invoice button remains available.
    setTimeout(()=>{
      try{ printInvoice(order); }catch(e){ console.warn("Auto print blocked",e); }
    },500);
  }
}

  const area=document.getElementById("qrArea"); if(!area)return;
  const base=location.origin+location.pathname;
  area.innerHTML=`<div class="qr-grid">${Array.from({length:CONFIG.TABLES},(_,i)=>{
    const n=i+1,url=`${base}?table=${n}`;
    return `<div class="qr-card"><strong>${t("ترابيزة","Table")} ${n}</strong><div class="qr-box" id="qr-${n}"></div><div class="qr-link">${url}</div><div class="actions" style="justify-content:center;margin-top:9px">
      <button class="btn" data-copyqr="${n}">${t("نسخ اللينك","Copy link")}</button>
      <a class="btn" target="_blank" href="${url}">${t("فتح","Open")}</a></div></div>`;
  }).join("")}</div>`;
  for(let n=1;n<=CONFIG.TABLES;n++){
    const url=`${base}?table=${n}`;
    new QRCode(document.getElementById(`qr-${n}`),{text:url,width:145,height:145});
  }
  area.querySelectorAll("[data-copyqr]").forEach(b=>b.onclick=async()=>{
    const n=b.dataset.copyqr;await navigator.clipboard.writeText(`${base}?table=${n}`);b.textContent=t("تم النسخ ✓","Copied ✓");
  });
}

  document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";
  document.getElementById("app").innerHTML=s.manager?manager():s.kitchen?kitchen():customer();
  bind();
}
