<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RestoFlow | Smart Restaurant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,Arial;background:#f5f3ee;color:#171717}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(14px);border-bottom:1px solid #e8e3d9;padding:12px 4%;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#d6ae62,#8b5c1c)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ded9d0;background:#fff;border-radius:11px;padding:9px 13px}.primary{background:#15171b;color:#fff;border-color:#15171b}.gold{background:#b78635;color:#fff;border-color:#b78635}.wrap{max-width:1250px;margin:auto;padding:28px 4%}.hero{padding:60px 7%;min-height:350px;color:#fff;background:linear-gradient(120deg,#111318,#302b23);border-radius:0 0 28px 28px}.hero h1{font-size:clamp(36px,7vw,72px);line-height:1;margin:12px 0}.hero p{max-width:700px;color:#ddd;line-height:1.8;font-size:18px}.badge{display:inline-block;border:1px solid #ffffff35;border-radius:999px;padding:7px 12px;color:#e9c979}.cats{display:flex;gap:8px;overflow:auto;margin:15px 0}.chip{border:1px solid #e4dfd6;background:#fff;border-radius:999px;padding:9px 15px;white-space:nowrap}.chip.on{background:#15171b;color:#fff}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.food,.panel,.stat,.order{background:#fff;border:1px solid #e7e2d9;border-radius:18px;box-shadow:0 15px 45px #1717170b}.food{overflow:hidden}.food img{width:100%;height:165px;object-fit:cover}.foodbody{padding:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:900;color:#8d6425}.cart{position:fixed;z-index:30;left:22px;bottom:22px;border:0;border-radius:18px;background:#15171b;color:#fff;padding:13px 18px;box-shadow:0 15px 40px #0003}.cart b{background:#b78635;border-radius:50px;padding:3px 8px}.panel{padding:20px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat strong{display:block;font-size:30px;margin-top:6px}.two{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.orders{display:grid;gap:10px}.order{padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px}.new{background:#fff0d5;color:#97620d}.preparing{background:#e9efff;color:#315aa2}.ready{background:#e4f7ec;color:#176e43}.served,.closed{background:#eee;color:#555}.paid{background:#e4f7ec;color:#176e43}.tablegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}.table{padding:13px;text-align:center;border:1px solid #e5dfd5;border-radius:14px}.active{border-color:#b78635;background:#fff8e9}.modal{position:fixed;inset:0;z-index:100;background:#0008;display:grid;place-items:center;padding:16px}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.close{float:left;border:0;border-radius:50%;width:34px;height:34px}.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.qty{display:flex;gap:6px;align-items:center}.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:8px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0}.step{height:8px;background:#e4e0d7;border-radius:20px}.step.on{background:#b78635}footer{text-align:center;padding:35px;color:#777}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hero{padding:45px 6%}.order{grid-template-columns:1fr}}@media(max-width:480px){.menu{grid-template-columns:1fr 1fr}.food img{height:130px}}
</style></head>
<body><div id="app"></div>
<script>
const CONFIG={SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co/rest/v1/",SUPABASE_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",RESTAURANT:"RestoFlow",CURRENCY:"ج.م",TABLES:30};
const fallbackMenu=[
{id:1,name_ar:"برجر كلاسيك",name_en:"Classic Burger",category:"burgers",price:185,image_url:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85"},
{id:2,name_ar:"تشيز برجر",name_en:"Cheese Burger",category:"burgers",price:215,image_url:"https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?auto=format&fit=crop&w=900&q=85"},
{id:3,name_ar:"بيتزا مارغريتا",name_en:"Margherita Pizza",category:"pizza",price:190,image_url:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=900&q=85"},
{id:4,name_ar:"بيتزا بيبروني",name_en:"Pepperoni Pizza",category:"pizza",price:230,image_url:"https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=900&q=85"},
{id:5,name_ar:"باستا ألفريدو",name_en:"Alfredo Pasta",category:"pasta",price:205,image_url:"https://images.unsplash.com/photo-1645112411341-6c4fd023714a?auto=format&fit=crop&w=900&q=85"},
{id:6,name_ar:"فراخ مشوية",name_en:"Grilled Chicken",category:"mains",price:260,image_url:"https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=85"},
{id:7,name_ar:"سيزر سالاد",name_en:"Caesar Salad",category:"salads",price:145,image_url:"https://images.unsplash.com/photo-1550304943-4f24f54ddde9?auto=format&fit=crop&w=900&q=85"},
{id:8,name_ar:"تشيز كيك",name_en:"Cheesecake",category:"desserts",price:120,image_url:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=900&q=85"},
{id:9,name_ar:"مولتن كيك",name_en:"Molten Cake",category:"desserts",price:135,image_url:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85"},
{id:10,name_ar:"عصير مانجو",name_en:"Mango Juice",category:"drinks",price:75,image_url:"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=900&q=85"}];
const cats={all:["الكل","All"],burgers:["برجر","Burgers"],pizza:["بيتزا","Pizza"],pasta:["مكرونة","Pasta"],mains:["رئيسي","Mains"],salads:["سلطات","Salads"],desserts:["حلويات","Desserts"],drinks:["مشروبات","Drinks"]};
const p=new URLSearchParams(location.search);
let s={lang:"ar",menu:fallbackMenu,cat:"all",cart:[],orders:[],sb:null,table:Number(p.get("table"))||null,manager:p.get("manager")==="1",kitchen:p.get("kitchen")==="1",session:null};
const T=(a,e)=>s.lang==="ar"?a:e,nm=x=>s.lang==="ar"?x.name_ar:x.name_en,money=n=>`${Number(n||0).toLocaleString(s.lang==="ar"?"ar-EG":"en-US")} ${CONFIG.CURRENCY}`;

async function init(){
 if(!CONFIG.SUPABASE_URL.startsWith("YOUR_")&&!CONFIG.SUPABASE_KEY.startsWith("YOUR_")){
  s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
  await loadMenu();await loadSession();await loadOrders();
  s.sb.channel("restoflow-live").on("postgres_changes",{event:"*",schema:"public",table:"orders"},loadOrders).on("postgres_changes",{event:"*",schema:"public",table:"table_sessions"},()=>{loadSession();loadOrders()}).subscribe();
 }
 render();
}
async function loadMenu(){if(!s.sb)return;let r=await s.sb.from("menu_items").select("*").eq("active",true).order("sort_order");if(!r.error&&r.data?.length)s.menu=r.data}
async function loadSession(){if(!s.sb||!s.table)return;let r=await s.sb.from("table_sessions").select("*").eq("table_number",s.table).eq("status","open").order("opened_at",{ascending:false}).limit(1).maybeSingle();if(!r.error&&r.data)s.session=r.data}
async function loadOrders(){if(!s.sb)return;let q=s.sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);if(!s.manager&&!s.kitchen&&s.session)q=q.eq("session_id",s.session.id);let r=await q;if(!r.error&&r.data)s.orders=r.data}
async function ensureSession(){if(s.session)return s.session;if(!s.sb)return null;let r=await s.sb.from("table_sessions").insert({table_number:s.table,status:"open"}).select().single();if(r.error){await loadSession();return s.session}s.session=r.data;return s.session}
function header(){return `<header class="top"><div class="brand"><div class="logo">R</div><div>${CONFIG.RESTAURANT}<small class="muted" style="display:block">${T("نظام المطعم الذكي","Smart restaurant system")}</small></div></div><div class="actions"><button class="btn" id="lang">${s.lang==="ar"?"EN":"عربي"}</button><button class="btn" id="theme">◐</button>${(s.manager||s.kitchen)?`<button class="btn primary" id="customer">${T("واجهة الزبون","Customer")}</button>`:""}</div></header>`}
function customer(){return header()+`<section class="hero"><span class="badge">${T("ترابيزة","TABLE")} ${s.table||"—"} • ${T("اطلب من موبايلك","ORDER FROM YOUR PHONE")}</span><h1>${T("منيو المطعم<br>بين إيديك.","Your menu.<br>In your hands.")}</h1><p>${T("اختار أكلك، عدّل طلبك، ابعت الطلب للمطبخ، وتابع حالته وفاتورتك من نفس المكان.","Choose your food, customize it, send it to the kitchen, and track your order and bill from one place.")}</p></section><main class="wrap"><div class="row"><div><h2>${T("المنيو","Menu")}</h2><span class="muted">${T("اختيارات الشيف اليومية","Chef's daily selections")}</span></div><button class="btn" id="myorders">${T("طلباتي","My orders")}</button></div><div class="cats">${Object.entries(cats).map(([k,v])=>`<button class="chip ${s.cat===k?"on":""}" data-cat="${k}">${T(v[0],v[1])}</button>`).join("")}</div><div class="menu">${s.menu.filter(x=>s.cat==="all"||(x.category||x.cat)===s.cat).map(food).join("")}</div></main>${s.cart.length?`<button class="cart" id="cart">🛒 ${T("السلة","Cart")} <b>${s.cart.reduce((a,x)=>a+x.qty,0)}</b></button>`:""}<footer>RestoFlow</footer>`}
function food(x){return `<article class="food"><img src="${x.image_url||x.img||""}" alt=""><div class="foodbody"><h3>${nm(x)}</h3><div class="muted">${x.description_ar||x.description_en||T("اختيار شهي من الشيف","A delicious chef selection")}</div><div class="row" style="margin-top:13px"><span class="price">${money(x.price)}</span><button class="btn gold" data-add="${x.id}">+ ${T("إضافة","Add")}</button></div></div></article>`}
function dashboard(){let active=s.orders.filter(o=>!["paid","served","cancelled"].includes(o.status)).length,rev=s.orders.filter(o=>o.status==="paid").reduce((a,o)=>a+Number(o.total||0),0);return header()+`<main class="wrap"><section class="hero" style="border-radius:22px;min-height:auto"><span class="badge">${s.kitchen?T("شاشة المطبخ","KITCHEN"):T("لوحة المدير","MANAGER")}</span><h1>${s.kitchen?T("المطبخ تحت السيطرة.","Kitchen under control."):T("كل المطعم قدامك.","Your restaurant at a glance.")}</h1><p>${T("تحديث لحظي مع Supabase وتحديث دوري كل 5 دقائق.","Realtime with Supabase and a 5-minute refresh cycle.")}</p></section>${!s.kitchen?`<div class="stats" style="margin-top:18px"><div class="stat">👥 ${T("الطلبات","Orders")}<strong>${s.orders.length}</strong></div><div class="stat">🔥 ${T("في المطبخ","Kitchen")}<strong>${active}</strong></div><div class="stat">💰 ${T("المبيعات المدفوعة","Paid sales")}<strong>${money(rev)}</strong></div><div class="stat">🪑 ${T("الترابيزات","Tables")}<strong>30</strong></div></div>`:""}<div class="two" style="margin-top:18px"><section class="panel"><div class="row"><h2>${T("الطلبات","Orders")}</h2><span class="muted">Live</span></div><div class="orders">${s.orders.length?s.orders.map(orderCard).join(""):`<p class="muted">${T("لا توجد طلبات.","No orders.")}</p>`}</div></section>${!s.kitchen?`<section class="panel"><h2>${T("الترابيزات","Tables")}</h2><div class="tablegrid">${Array.from({length:30},(_,i)=>`<div class="table ${s.orders.some(o=>+o.table_number===i+1&&!["paid","served"].includes(o.status))?"active":""}"><b>${i+1}</b><br><small>${s.orders.some(o=>+o.table_number===i+1&&!["paid","served"].includes(o.status))?T("نشطة","Active"):T("متاحة","Free")}</small></div>`).join("")}</div></section>`:""}</div></main><footer>RestoFlow</footer>`}
function orderCard(o){let L={new:["جديد","New","new"],preparing:["قيد التحضير","Preparing","preparing"],ready:["جاهز","Ready","ready"],served:["تم التقديم","Served","served"],paid:["مدفوع","Paid","paid"],cancelled:["ملغي","Cancelled","closed"]}[o.status]||["جديد","New","new"];let c=(s.manager||s.kitchen)&&!["paid","cancelled"].includes(o.status)?`<div class="actions" style="margin-top:10px">${o.status==="new"?`<button class="btn" data-status="preparing" data-order="${o.id}">${T("بدء التحضير","Start")}</button>`:""}${o.status==="preparing"?`<button class="btn" data-status="ready" data-order="${o.id}">${T("جاهز","Ready")}</button>`:""}${o.status==="ready"?`<button class="btn" data-status="served" data-order="${o.id}">${T("تم التقديم","Served")}</button>`:""}${o.status==="served"&&s.manager?`<button class="btn gold" data-status="paid" data-order="${o.id}">${T("تأكيد الدفع","Mark paid")}</button>`:""}</div>`:"";return `<div class="order"><div><b>#${o.id}</b> • ${T("ترابيزة","Table")} ${o.table_number}<div class="muted" style="margin-top:7px">${(o.order_items||[]).map(i=>`${i.name_ar||i.name||i.name_en} × ${i.quantity}`).join(" • ")}</div>${c}</div><div><span class="status ${L[2]}">${T(L[0],L[1])}</span><div style="margin-top:8px">${money(o.total)}</div></div></div>`}
function modal(x){let d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="modalbox"><button class="close">×</button>${x}</div>`;d.querySelector(".close").onclick=()=>d.remove();d.onclick=e=>e.target===d&&d.remove();document.body.appendChild(d);return d}
function cartModal(){let d=modal(`<h2>${T("سلة الطلب","Your order")}</h2>${s.cart.map((x,i)=>{let f=s.menu.find(m=>+m.id===+x.id);return `<div class="item"><div><b>${nm(f)}</b><br><span class="muted">${money(f.price)} × ${x.qty}</span></div><div class="qty"><button data-dec="${i}">−</button>${x.qty}<button data-inc="${i}">+</button></div></div>`}).join("")}<button class="btn gold" style="width:100%;margin-top:16px" id="send">${T("إرسال للمطبخ","Send to kitchen")}</button>`);d.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{s.cart[+b.dataset.inc].qty++;d.remove();cartModal()});d.querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{let i=+b.dataset.dec;s.cart[i].qty--;if(s.cart[i].qty<=0)s.cart.splice(i,1);d.remove();render();if(s.cart.length)cartModal()});d.querySelector("#send").onclick=()=>sendOrder(d)}
async function sendOrder(d){if(!s.table)return alert(T("الـQR لازم يكون مربوط بترابيزة.","This QR must belong to a table."));let session=await ensureSession();if(!session)return alert(T("تعذر إنشاء جلسة. تأكد من Supabase.","Could not create a session. Check Supabase."));let items=s.cart.map(x=>{let f=s.menu.find(m=>+m.id===+x.id);return{menu_item_id:f.id,name:f.name_en||f.name_ar,name_ar:f.name_ar,name_en:f.name_en,price:f.price,quantity:x.qty}}),total=items.reduce((a,i)=>a+i.price*i.quantity,0),o={id:"LOCAL-"+Date.now(),table_number:s.table,session_id:session.id,total,status:"new",order_items:items};if(s.sb){let r=await s.sb.from("orders").insert({table_number:s.table,session_id:session.id,total,status:"new"}).select().single();if(r.error)return alert(r.error.message);o.id=r.data.id;let ri=await s.sb.from("order_items").insert(items.map(i=>({...i,order_id:o.id})));if(ri.error)return alert(ri.error.message)}s.orders.unshift(o);s.cart=[];d.remove();tracking(o);render()}
function tracking(o){let d=modal(`<h2>🔥 ${T("طلبك وصل للمطبخ","Order sent to kitchen")}</h2><p>#${o.id} • ${T("ترابيزة","Table")} ${o.table_number}</p><div class="steps"><i class="step on"></i><i class="step"></i><i class="step"></i><i class="step"></i></div><h3>${T("تم استلام الطلب","Order received")}</h3><button class="btn gold" id="bill">${T("الفاتورة","Bill")}</button>`);d.querySelector("#bill").onclick=()=>{d.remove();bill(o)}}
function ordersModal(){let os=s.orders.filter(o=>+o.table_number===+s.table&&(!s.session||o.session_id===s.session.id));modal(`<h2>${T("طلبات الترابيزة","Table orders")}</h2>${os.length?os.map(orderCard).join(""):`<p class="muted">${T("لا توجد طلبات.","No orders.")}</p>`}`)}
function bill(o){modal(`<h2>🧾 ${T("الفاتورة","Bill")}</h2><div class="panel">${(o.order_items||[]).map(i=>`<div class="item"><span>${i.name_ar||i.name} × ${i.quantity}</span><b>${money(i.price*i.quantity)}</b></div>`).join("")}<div class="row" style="margin-top:15px;font-size:20px"><b>${T("الإجمالي","Total")}</b><b>${money(o.total)}</b></div></div><h3>${T("طريقة الدفع","Payment")}</h3><div class="actions"><button class="btn">💵 ${T("كاش","Cash")}</button><button class="btn">💳 ${T("بطاقة","Card")}</button><button class="btn">📱 ${T("محفظة","Wallet")}</button><button class="btn">🌐 ${T("أونلاين","Online")}</button></div><p class="muted">${T("الدفع الإلكتروني الحقيقي يحتاج بوابة دفع وBackend/Edge Function. لا تضع المفاتيح السرية هنا.","Real online payment needs a gateway and backend/Edge Function. Never put secret keys here.")}</p>`)}
async function updateStatus(id,status){if(!s.sb)return alert(T("اربط Supabase أولاً.","Connect Supabase first."));let patch={status};if(status==="served")patch.served_at=new Date().toISOString();if(status==="paid")patch.payment_status="paid";let r=await s.sb.from("orders").update(patch).eq("id",id);if(r.error)alert(r.error.message);else loadOrders()}
function bind(){document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});document.getElementById("theme")?.addEventListener("click",()=>{document.body.style.filter=document.body.style.filter?"":"invert(.92) hue-rotate(180deg)"});document.getElementById("customer")?.addEventListener("click",()=>{s.manager=false;s.kitchen=false;render()});document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{s.cat=b.dataset.cat;render()});document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let id=+b.dataset.add,q=s.cart.find(x=>+x.id===id);q?q.qty++:s.cart.push({id,qty:1});render()});document.getElementById("cart")?.addEventListener("click",cartModal);document.getElementById("myorders")?.addEventListener("click",ordersModal);document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>updateStatus(b.dataset.order,b.dataset.status))}
function render(){document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";document.documentElement.lang=s.lang;document.getElementById("app").innerHTML=(s.manager||s.kitchen)?dashboard():customer();bind()}
setInterval(()=>{if(s.sb){loadOrders();if(s.table)loadSession()}},300000);
init();
</script></body></html>
