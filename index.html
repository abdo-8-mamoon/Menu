<style>
:root{
  --ink:#221a26;
  --ink-soft:#3a2e40;
  --paper:#f6f0e4;
  --card:#fffdf8;
  --text:#231c22;
  --muted:#8a7d70;
  --line:#e6dcc7;
  --accent:#a9762f;
  --accent-deep:#7d5620;
  --dark:#221a26;
  --good:#2e6b4e;
  --shadow:0 20px 45px -18px rgba(34,20,20,.28)
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased
}

button{
  font:inherit;
  cursor:pointer
}

h1,h2,h3,.brand,.price{
  font-family:"Markazi Text","IBM Plex Sans Arabic",Tahoma,serif
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fffcf5ea;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:12px 4vw;
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:700;
  font-size:19px;
  letter-spacing:.2px
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(150deg,#c99a4f,var(--accent-deep));
  display:grid;
  place-items:center;
  color:#fff8ea;
  font-size:20px;
  font-family:"Markazi Text",serif;
  font-weight:700;
  box-shadow:0 8px 16px -6px rgba(125,86,32,.55)
}

.actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.btn{
  font-family:inherit;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:10px 15px;
  border-radius:12px;
  transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease
}

.btn:hover{
  box-shadow:0 6px 16px -8px rgba(34,20,20,.3)
}

.btn:active{
  transform:translateY(1px)
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  box-shadow:none;
  transform:none
}

.primary{
  background:var(--dark);
  color:#fbf3e4;
  border-color:var(--dark)
}

.gold{
  background:linear-gradient(160deg,#bb8638,var(--accent-deep));
  color:#fff8ea;
  border-color:var(--accent-deep)
}

.hero{
  min-height:340px;
  padding:60px 7vw;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 82% 20%,#c99a4f28,transparent 45%),
    radial-gradient(circle at 10% 85%,#7d562033,transparent 40%),
    linear-gradient(155deg,#1c1520,var(--ink));
  color:#fbf5ea;
  position:relative;
  overflow:hidden
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(0deg,rgba(34,26,38,.4),transparent 55%);
  pointer-events:none
}

.hero>div{
  position:relative
}

.hero h1{
  font-weight:600;
  font-size:clamp(38px,6.4vw,72px);
  line-height:1.06;
  margin:0 0 16px;
  color:#fdf7ea
}

.hero p{
  max-width:620px;
  color:#e4dbca;
  font-size:18px;
  line-height:1.85
}

.badge{
  display:inline-block;
  border:1px solid #d9b46a4d;
  background:#00000022;
  border-radius:999px;
  padding:7px 14px;
  color:#e7c982;
  font-size:14px;
  margin-bottom:16px
}

.container{
  max-width:1250px;
  margin:auto;
  padding:30px 4vw
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:12px;
  margin:6px 0 22px
}

.section-title h2{
  margin:0;
  font-weight:600;
  font-size:32px;
  color:var(--ink)
}

.muted{
  color:var(--muted)
}

.categories{
  display:flex;
  gap:6px;
  overflow:auto;
  padding-bottom:10px;
  border-bottom:1px solid var(--line)
}

.chip{
  white-space:nowrap;
  padding:10px 4px;
  margin:0 10px;
  border:0;
  border-bottom:2px solid transparent;
  background:transparent;
  color:var(--muted);
  border-radius:0;
  font-weight:500;
  transition:color .15s ease,border-color .15s ease
}

.chip:hover{
  color:var(--text)
}

.chip.active{
  background:transparent;
  color:var(--accent-deep);
  border-bottom-color:var(--accent)
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
  gap:18px
}

.food{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease
}

.food:hover{
  transform:translateY(-4px);
  box-shadow:0 26px 50px -20px rgba(34,20,20,.35)
}

.food img{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
  transition:transform .4s ease
}

.food:hover img{
  transform:scale(1.045)
}

.food-body{
  padding:16px
}

.food h3{
  margin:0 0 6px;
  font-weight:600;
  font-size:21px;
  color:var(--ink)
}

.price{
  font-weight:600;
  color:var(--accent-deep);
  font-size:20px
}

.food-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:14px
}

.cart{
  position:fixed;
  left:22px;
  bottom:22px;
  z-index:30;
  background:var(--ink);
  color:#fbf3e4;
  border:0;
  border-radius:999px;
  padding:14px 20px;
  box-shadow:0 18px 40px -10px rgba(34,20,20,.55);
  font-weight:600;
  transition:transform .15s ease
}

.cart:hover{
  transform:translateY(-2px)
}

.cart span{
  background:var(--accent);
  border-radius:999px;
  padding:3px 8px;
  margin-right:6px;
  font-weight:700
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px
}

.modal{
  position:fixed;
  inset:0;
  background:#1d1520b3;
  backdrop-filter:blur(3px);
  z-index:50;
  display:grid;
  place-items:center;
  padding:18px
}

.modal-card{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:22px;
  padding:24px;
  box-shadow:0 40px 90px -25px rgba(20,12,10,.5)
}

.modal-card h2{
  font-weight:600;
  font-size:26px;
  color:var(--ink)
}

.close{
  float:left;
  border:0;
  background:var(--paper);
  color:var(--muted);
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:16px
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}

.qty{
  display:flex;
  align-items:center;
  gap:8px
}

.qty button{
  width:30px;
  height:30px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:8px;
  color:var(--text)
}

.track{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:20px 0
}

.step{
  height:7px;
  border-radius:9px;
  background:var(--line)
}

.step.on{
  background:var(--accent)
}

.status{
  display:inline-block;
  border-radius:999px;
  padding:5px 11px;
  font-size:12px;
  font-weight:600
}

.s-new{
  background:#f5e6c7;
  color:#8d5f10
}

.s-prep{
  background:#e4e6f5;
  color:#3d4c9b
}

.s-ready{
  background:#dcf0e4;
  color:#1f6b45
}

.s-served{
  background:#eae5db;
  color:#66594c
}

.s-paid{
  background:#dcf0e4;
  color:#1f6b45
}

.invoice-actions{
  display:flex;
  gap:8px;
  margin-top:15px
}

.invoice-actions .btn{
  flex:1
}


.qr-scan-box{text-align:center}
#cashQrReader{width:100%;max-width:420px;margin:16px auto;overflow:hidden;border-radius:18px;border:1px solid var(--line)}
.qr-scan-status{padding:12px;border-radius:12px;background:var(--paper);color:var(--muted);font-weight:600;margin-top:10px}
.qr-scan-actions{display:flex;gap:8px;margin-top:12px}
.qr-scan-actions .btn{flex:1}

.payment-loading{
  padding:14px;
  margin-top:12px;
  border-radius:14px;
  background:#f7ecd6;
  color:var(--accent-deep);
  text-align:center;
  font-weight:600
}

footer{
  padding:40px 4vw;
  color:var(--muted);
  text-align:center;
  border-top:1px solid var(--line);
  margin-top:20px
}

@media(max-width:480px){
  .food img{
    height:145px
  }

  .container{
    padding:24px 4vw
  }
}
</style>

async function init(){

  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){

    s.sb=supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );

    await loadMenu();
    await loadOrders();

    s.sb.channel("rf-live")

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"orders"
        },
        async()=>{
          await loadOrders();
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"order_items"
        },
        async()=>{
          await loadOrders();
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"menu_items"
        },
        async()=>{
          await loadMenu();
        }
      )

      .subscribe();
  }

  render();
  setTimeout(handlePaymentReturn, 500);
}


async function loadMenu(){

  if(!s.sb)return;

  const r=await s.sb
    .from("menu_items")
    .select("*")
    .eq("active",true)
    .order("sort_order");

  if(!r.error && r.data && r.data.length){
    s.menu=r.data;
  }
}


async function loadOrders(){

  if(!s.sb)return;

  let q=s.sb
    .from("orders")
    .select("*,order_items(*)")
    .order("created_at",{ascending:false})
    .limit(100);

  if(s.table && s.mode==="customer"){
    q=q.eq("table_number",s.table);
  }

  const r=await q;

  if(!r.error && r.data){
    s.orders=r.data;
  }

  render();
}

      "click",
      ()=>{
        s.lang=s.lang==="ar"?"en":"ar";
        render();
      }
    );


  document
    .getElementById("theme")
    ?.addEventListener(
      "click",
      ()=>{
        s.dark=!s.dark;

        document.body.style.filter=
          s.dark
            ?"invert(.92) hue-rotate(180deg)"
            :"none";

        render();
      }
    );


  document
    .querySelectorAll("[data-cat]")
    .forEach(
      b=>
        b.onclick=()=>{
          s.cat=b.dataset.cat;
          render();
        }
    );


  document
    .querySelectorAll("[data-add]")
    .forEach(
      b=>
        b.onclick=()=>add(
          +b.dataset.add
        )
    );


  document
    .getElementById("cart")
    ?.addEventListener(
      "click",
      cartModal
    );


  document
    .getElementById("orders")
    ?.addEventListener(
      "click",
      ordersModal
    );
}


function add(id){

  let f=s.menu.find(
    x=>+x.id===id
  );

  if(!f)return;

  let q=s.cart.find(
    x=>+x.id===id
  );

  q
    ?q.qty++
    :s.cart.push({
      id,
      qty:1
    });

  render();
}


function modal(content){

  let d=document.createElement("div");

  d.className="modal";

  d.innerHTML=`
    <div class="modal-card">

      <button class="close">
        ×
      </button>

      ${content}

    </div>
  `;

  d.querySelector(".close")
    .onclick=()=>d.remove();

  d.onclick=e=>{
    if(e.target===d){
      d.remove();
    }
  };

  document.body.appendChild(d);

  return d;
}


function cartModal(){

  let d=modal(`
    <h2>
      ${t("سلة الطلب","Your order")}
    </h2>

    <div>

      ${s.cart.map((x,i)=>{

        let f=s.menu.find(
          m=>+m.id===+x.id
        );

        return `
          <div class="cart-item">

            <span>

              <b>
                ${name(f)}
              </b>

              <br>

              ${money(f.price)} × ${x.qty}

            </span>

            <span class="qty">

              <button data-dec="${i}">
                −
              </button>

              <button data-inc="${i}">
                +
              </button>

            </span>

      }).join("")}

    </div>


    <button

        "إرسال للمطبخ",
        "Send to kitchen"
      )}
    </button>
  `);


  d.querySelectorAll("[data-inc]")
    .forEach(
      b=>
        b.onclick=()=>{
          s.cart[
            +b.dataset.inc
          ].qty++;

          d.remove();

          cartModal();
        }
    );


  d.querySelectorAll("[data-dec]")
    .forEach(
      b=>
        b.onclick=()=>{
          let i=+b.dataset.dec;

          s.cart[i].qty--;

          if(s.cart[i].qty<=0){
            s.cart.splice(i,1);
          }

          d.remove();

          render();

          if(s.cart.length){
            cartModal();
          }
        }
    );


  d.querySelector("#send")
    .onclick=()=>place(d);
}


async function place(d){

  if(!s.table){

    alert(
      t(
        "هذا الرابط ليس مربوطاً بترابيزة.",
        "This link is not assigned to a table."
      )
    );

    return;
  }


  let items=s.cart.map(x=>{

    let f=s.menu.find(
      m=>+m.id===+x.id
    );

    return {

      menu_item_id:f.id,

      name:
        f.name_en||
        f.name_ar,

      name_ar:f.name_ar,

      name_en:f.name_en,

      price:f.price,

      quantity:x.qty
    };

  });


  let total=items.reduce(
    (a,i)=>
      a+
      Number(i.price)*
      Number(i.quantity),
    0
  );


  let o={
    id:"LOCAL-"+Date.now(),
    table_number:s.table,
    total,
    status:"new",
    order_items:items
  };


  if(s.sb){

    let sessionId=null;


    const sr=
      await s.sb
        .from("table_sessions")
        .select("id")
        .eq("table_number",s.table)
        .eq("status","open")
        .order(
          "opened_at",
          {ascending:false}
        )
        .limit(1)
        .maybeSingle();


    if(sr.error){

      alert(
        "خطأ في جلب جلسة الترابيزة: "+
        sr.error.message
      );

      return;
    }


    if(sr.data){

      sessionId=sr.data.id;

    }else{

      const ns=
        await s.sb
          .from("table_sessions")
          .insert({
            table_number:s.table,
            status:"open"
          })
          .select("id")
          .single();


      if(ns.error){

        alert(
          "خطأ في إنشاء جلسة الترابيزة: "+
          ns.error.message
        );

        return;
      }

      sessionId=ns.data.id;
    }


    const r=
      await s.sb
        .from("orders")
        .insert({
          table_number:s.table,
          session_id:sessionId,
          total,
          status:"new"
        })
        .select()
        .single();


    if(r.error){

      alert(r.error.message);

      return;
    }


    o.id=r.data.id;
    o.session_id=sessionId;


    const ri=
      await s.sb
        .from("order_items")
        .insert(
          items.map(
            i=>({
              ...i,
              order_id:o.id
            })
          )
        );


    if(ri.error){

      alert(ri.error.message);

      return;
    }

  }


  s.orders.unshift(o);

  s.cart=[];

  s.currentOrder=o;

  d.remove();

  tracking(o);

  render();
}

function drawTrack(d,status){

  const steps=[
    "new",
    "preparing",
    "ready",
    "served"
  ];

  const idx=
    steps.indexOf(status);


  d.querySelector("#track")
    .innerHTML=
      steps.map(
        (_,i)=>
          `<i class="step ${
            i<=idx?"on":""
          }"></i>`
      ).join("");


  const labels={
    new:[
      "تم استلام الطلب",
      "Order received"
    ],

    preparing:[
      "جاري التحضير",
      "Preparing"
    ],

    ready:[
      "الطلب جاهز",
      "Order ready"
    ],

    served:[
      "تم التقديم",
      "Served"
    ]
  };


  d.querySelector("#trackStatus")
    .textContent=
      t(
        labels[status]?.[0]||
        "تم استلام الطلب",

        labels[status]?.[1]||
        "Order received"
      );
}

function confirmCashAfterQr(o,invoiceModal,note,originalBtn){
  if(!s.sb){
    alert(t("Supabase غير متصل.","Supabase is not connected."));
    originalBtn.disabled=false;
    return;
  }

  originalBtn.disabled=true;
  note.className="payment-loading";
  note.textContent=t(
    "تم مسح QR الجرسون ✓ جاري تسجيل الدفع كاش...",
    "Waiter QR scanned ✓ Registering cash payment..."
  );

  s.sb.from("orders").update({
    payment_status:"paid",
    payment_method:"cash",
    paid_at:new Date().toISOString()
  }).eq("id",o.id).then(r=>{
    if(r.error){
      originalBtn.disabled=false;
      note.className="muted";
      note.textContent=r.error.message;
      return;
    }

    // Cash is considered paid immediately after the waiter QR is scanned.
    // Keep the kitchen order status unchanged.
    o.payment_status="paid";
    o.payment_method="cash";
    o.paid_at=new Date().toISOString();

    invoiceModal.remove();
    render();
    tracking(o);
  });
}

async function cashQrScanner(o,invoiceModal,note,originalBtn){
  const scanModal=modal(`
    <div class="qr-scan-box" dir="${s.lang==="ar"?"rtl":"ltr"}">
      <h2>${t("تأكيد الدفع كاش","Confirm cash payment")}</h2>
      <p class="muted">${t(
        "افتح الكاميرا وامسح QR الجرسون المطبوع.",
        "Open the camera and scan the printed waiter QR."
      )}</p>
      <div id="cashQrReader"></div>
      <div id="cashQrStatus" class="qr-scan-status">${t(
        "وجه الكاميرا ناحية QR الجرسون...",
        "Point the camera at the waiter QR..."
      )}</div>
      <div class="qr-scan-actions">
        <button class="btn" id="closeCashScanner">${t("إلغاء","Cancel")}</button>
      </div>
    </div>
  `);

  let scanner=null;
  let finished=false;

  const closeScanner=async()=>{
    if(finished)return;
    finished=true;
    try{
      if(scanner){
        await scanner.stop();
        await scanner.clear();
      }
    }catch(e){}
    scanModal.remove();
    originalBtn.disabled=false;
    note.className="muted";
    note.textContent=t(
      "لم يتم تسجيل الكاش. يمكنك المحاولة مرة أخرى.",
      "Cash was not registered. You can try again."
    );
  };

  scanModal.querySelector("#closeCashScanner").onclick=closeScanner;

  if(typeof Html5Qrcode==="undefined"){
    scanModal.querySelector("#cashQrStatus").textContent=t(
      "تعذر تحميل قارئ QR. تأكد من الإنترنت ثم حاول مرة أخرى.",
      "QR scanner could not load. Check your internet connection and try again."
    );
    return;
  }

  scanner=new Html5Qrcode("cashQrReader");

  try{
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras || !cameras.length){
      throw new Error(t("لم يتم العثور على كاميرا.","No camera was found."));
    }

    const preferred=cameras.find(c=>/back|rear|environment|خلف/i.test(c.label))||cameras[0];

    await scanner.start(
      preferred.id,
      {fps:10,qrbox:{width:250,height:250},aspectRatio:1},
      async(decodedText)=>{
        if(finished)return;

        let valid=false;
        try{
          const u=new URL(decodedText);
          valid=
            u.origin==="https://abdo-8-mamoon.github.io" &&
            u.pathname==="/Menu/" &&
            u.searchParams.get("mode")==="cashier";
        }catch(e){}

        if(!valid){
          scanModal.querySelector("#cashQrStatus").textContent=t(
            "ده مش QR الجرسون الخاص بـ RestoFlow. جرّب تاني.",
            "This is not the RestoFlow waiter QR. Please try again."
          );
          return;
        }

        finished=true;
        scanModal.querySelector("#cashQrStatus").textContent=t(
          "تم التعرف على QR الجرسون ✓",
          "Waiter QR recognized ✓"
        );

        try{
          await scanner.stop();
          await scanner.clear();
        }catch(e){}

        scanModal.remove();
        confirmCashAfterQr(o,invoiceModal,note,originalBtn);
      },
      ()=>{}
    );
  }catch(error){
    console.error("QR camera error:",error);
    scanModal.querySelector("#cashQrStatus").textContent=
      error?.message||t(
        "مش قادر أفتح الكاميرا. اسمح للموقع باستخدام الكاميرا ثم حاول مرة أخرى.",
        "Could not open the camera. Allow camera access and try again."
      );
  }
}

      w.document.close();

    }
  );


  d.querySelectorAll(
    "[data-pay]"
  ).forEach(
    btn=>{

      btn.addEventListener(
        "click",
        async()=>{

          const method=
            btn.dataset.pay;

          const note=
            d.querySelector(
              "#paymentNote"
            );


          // ======================================
          // PAYMOB CARD / MOBILE WALLET PAYMENT
          // ======================================

          if(method==="online" || method==="card" || method==="wallet"){

            // Paymob Integration IDs
            // Card: 5889037
            // Mobile Wallet: 5889814
            const paymentMethod =
              method === "wallet" ? "wallet" : "card";

            const integrationId =
              paymentMethod === "wallet"
                ? "5889814"
                : "5889037";

            // For wallet payments, ask for the Egyptian wallet number.
            let walletNumber = "";

            if(paymentMethod === "wallet"){
              walletNumber = window.prompt(
                t(
                  "اكتب رقم المحفظة (مثال: 01010101010)",
                  "Enter wallet number (example: 01010101010)"
                ),
                ""
              ) || "";

              walletNumber = walletNumber.replace(/\D/g, "");

              if(!/^01\d{9}$/.test(walletNumber)){
                note.className="muted";
                note.textContent=t(
                  "رقم المحفظة غير صحيح. اكتب رقم مصري 11 رقم يبدأ بـ 01.",
                  "Invalid wallet number. Enter an 11-digit Egyptian number starting with 01."
                );
                return;
              }
            }

            if(!s.sb){

              note.textContent=
                t(
                  "Supabase غير متصل.",
                  "Supabase is not connected."
                );

              return;
            }


            // Prevent double click

            btn.disabled=true;

            note.className=
              "payment-loading";

            note.textContent=
              t(
                "جاري تجهيز الدفع الآمن...",
                "Preparing secure payment..."
              );


            try{

              console.log(
                "Starting Paymob payment for order:",
                o.id
              );


              const {
                data,
                error
              }=
                await s.sb.functions.invoke(
                  "create-kashier-payment",
                  {
                    body:{
                      order_id:o.id,
                      payment_method:paymentMethod,
                      integration_id:integrationId,
                      ...(paymentMethod === "wallet"
                        ? { wallet_number:walletNumber }
                        : {})
                    }
                  }
                );


              console.log(
                "Paymob response:",
                data
              );

              console.log(
                "Paymob function error:",
                error
              );


              if(error){

                throw new Error(
                  error.message||
                  "Payment function failed"
                );

              }


              if(!data || !data.success){
                throw new Error(
                  data?.error ||
                  "Paymob payment could not be started"
                );
              }

              // Card returns checkout_url.
              // Wallet returns redirect_url.
              const paymentUrl =
                paymentMethod === "wallet"
                  ? data.redirect_url
                  : data.checkout_url;

              if(!paymentUrl){
                throw new Error(
                  paymentMethod === "wallet"
                    ? "Paymob wallet redirect URL was not returned"
                    : "Paymob checkout URL was not returned"
                );
              }


              // Save payment information

              localStorage.setItem(
                "restoflow_payment_method",
                paymentMethod
              );

              localStorage.setItem(
                "restoflow_payment_order",
                String(o.id)
              );

              localStorage.setItem(
                "restoflow_payment_table",
                String(s.table || o.table_number || "")
              );


              localStorage.setItem(
                "restoflow_payment_reference",
                String(
                  data.reference||""
                )
              );


              localStorage.setItem(
                "restoflow_paymob_order",
                String(
                  data.paymob_order_id||""
                )
              );


              console.log(
                "Opening Paymob Checkout..."
              );


              // Open Paymob

              window.location.href=
                paymentUrl;


            }catch(error){

              console.error(
                "Online payment error:",
                error
              );


              btn.disabled=false;

              note.className="muted";


              note.textContent=
                error?.message||
                t(
                  "حدث خطأ أثناء تجهيز الدفع.",
                  "Payment initialization failed."
                );

            }

            return;
          }


          // ======================================
          // CASH PAYMENT
          // Cash is NOT considered paid until a cashier confirms it.
          // ======================================

          if(method==="cash"){

            if(!s.sb){
              note.textContent=
                t(
                  "Supabase غير متصل.",
                  "Supabase is not connected."
                );
              return;
            }

            btn.disabled=true;
            note.className="payment-loading";
            note.textContent=t(
              "افتح الكاميرا وامسح QR الجرسون...",
              "Open the camera and scan the waiter QR..."
            );

            await cashQrScanner(o,d,note,btn);
            return;
          }

          // ======================================
          // CARD / WALLET
          // ======================================

          if(!s.sb){

            note.textContent=
              t(
                "Supabase غير متصل.",
                "Supabase is not connected."
              );

            return;
          }


          btn.disabled=true;


          const paymentMethod=
            method;


          const patch={
            payment_status:"paid",
            payment_method:
              paymentMethod,
            paid_at:
              new Date().toISOString(),
            status:"paid"
          };


          const r=
            await s.sb
              .from("orders")
              .update(patch)
              .eq("id",o.id);


          if(r.error){

            btn.disabled=false;

            note.textContent=
              r.error.message;

            return;
          }


          o.payment_status="paid";
          o.payment_method=
            paymentMethod;
          o.paid_at=
            patch.paid_at;
          o.status="paid";


          note.className=
            "payment-loading";

          note.textContent=
            t(
              "تم تسجيل الدفع بنجاح ✓",
              "Payment recorded successfully ✓"
            );


          setTimeout(
            ()=>{
              d.remove();
              render();
            },
            500
          );

        }
      );

    }
  );

}



async function fetchOrderForPaymentReturn(orderId){
  if(!s.sb || !orderId) return null;

  const {data,error}=await s.sb
    .from("orders")
    .select("*,order_items(*)")
    .eq("id",orderId)
    .maybeSingle();

  if(error){
    console.error(
      "Payment return order lookup error:",
      error
    );
    return null;
  }

  return data || null;
}

async function handlePaymentReturn(){
  const paramsNow =
    new URLSearchParams(location.search);

  const isReturn =
    paramsNow.get("payment")==="return" ||
    paramsNow.get("payment")==="success" ||
    paramsNow.get("success")==="true" ||
    paramsNow.get("success")==="1" ||
    paramsNow.has("id") ||
    paramsNow.has("txn_response_code") ||
    paramsNow.has("merchant_order_id");

  if(!isReturn || !s.sb) return;

  const savedTable =
    localStorage.getItem(
      "restoflow_payment_table"
    );

  if(savedTable){
    const tableNumber=Number(savedTable);

    if(
      Number.isFinite(tableNumber) &&
      tableNumber>0
    ){
      s.table=tableNumber;
    }
  }

  const savedOrderId =
    localStorage.getItem(
      "restoflow_payment_order"
    );

  if(!savedOrderId){
    paymentReturnMessage(
      "error",
      t(
        "تعذر تحديد الطلب.",
        "Could not determine the order."
      )
    );
    return;
  }

  let order =
    await fetchOrderForPaymentReturn(
      savedOrderId
    );

  if(!order){
    paymentReturnMessage(
      "error",
      t(
        "تعذر العثور على الطلب.",
        "The order could not be found."
      )
    );
    return;
  }

  /*
    The Response Callback is only the customer return.
    We wait for paymob-webhook to update Supabase.
  */
  let tries=0;
  const maxTries=30;

  while(
    order &&
    order.payment_status!=="paid" &&
    order.status!=="paid" &&
    order.payment_status!=="failed" &&
    tries<maxTries
  ){
    await new Promise(
      resolve=>setTimeout(resolve,1000)
    );

    const refreshed =
      await fetchOrderForPaymentReturn(
        savedOrderId
      );

    if(refreshed){
      order=refreshed;
    }

    tries++;
  }

  // One final fresh read.
  order =
    await fetchOrderForPaymentReturn(
      savedOrderId
    ) || order;

  const paid =
    order.payment_status==="paid" ||
    order.status==="paid";

  const failed =
    order.payment_status==="failed";

  if(paid){

    localStorage.removeItem(
      "restoflow_payment_method"
    );

    localStorage.removeItem(
      "restoflow_payment_order"
    );

    localStorage.removeItem(
      "restoflow_payment_reference"
    );

    localStorage.removeItem(
      "restoflow_paymob_order"
    );

    // Keep table in URL and remove Paymob callback params.
    try{
      const cleanUrl =
        location.origin+
        location.pathname+
        (
          s.table
            ? `?table=${s.table}`
            : ""
        );

      window.history.replaceState(
        {},
        document.title,
        cleanUrl
      );
    }catch(e){
      console.warn(
        "Could not clean payment URL:",
        e
      );
    }

    // IMPORTANT: show the real paid invoice.
    bill(order);

    return;
  }

  if(failed){
    paymentReturnMessage(
      "failed",
      t(
        "لم يتم الدفع",
        "Payment failed"
      ),
      t(
        "Paymob أكد أن العملية لم تكتمل. يمكنك إعادة المحاولة.",
        "Paymob reported that the payment was not completed. You can try again."
      ),
      order
    );
    return;
  }

  paymentReturnMessage(
    "pending",
    t(
      "جاري تأكيد الدفع...",
      "Confirming payment..."
    ),
    t(
      "تم الرجوع من Paymob، لكن تأكيد السيرفر لم يصل بعد.",
      "You returned from Paymob, but the server confirmation has not arrived yet."
    ),
    order
  );
}

function paymentReturnMessage(
  type,
  title,
  message,
  order=null
){
  const icon =
    type==="failed"
      ? "❌"
      : type==="pending"
        ? "⏳"
        : "⚠️";

  const d=modal(`
    <div style="text-align:center;padding:12px">

      <div style="font-size:52px">
        ${icon}
      </div>

      <h2>${title}</h2>

      <p class="muted">
        ${message || ""}
      </p>

      ${
        order
          ? `
            <div class="panel">
              <b>
                ${t("الطلب","Order")}
                #${order.id}
              </b>

              <div
                style="
                  display:flex;
                  justify-content:space-between;
                  margin-top:12px;
                  font-size:20px;
                  font-weight:900
                "
              >
                <span>
                  ${t("الإجمالي","Total")}
                </span>

                <span class="price">
                  ${money(order.total)}
                </span>
              </div>
            </div>
          `
          : ""
      }

      ${
        type==="failed" && order
          ? `
            <button
              class="btn gold"
              id="retryPaymentReturn"
            >
              ↻
              ${t(
                "حاول مرة أخرى",
                "Try again"
              )}
            </button>
          `
          : ""
      }

      ${
        type==="pending" && order
          ? `
            <button
              class="btn gold"
              id="checkPaymentReturn"
            >
              ⟳
              ${t(
                "تحقق من الدفع",
                "Check payment"
              )}
            </button>
          `
          : ""
      }

    </div>
  `);

  d
    .querySelector("#retryPaymentReturn")
    ?.addEventListener(
      "click",
      ()=>{
        d.remove();
        bill(order);
      }
    );

  d
    .querySelector("#checkPaymentReturn")
    ?.addEventListener(
      "click",
      async()=>{
        d.remove();
        await handlePaymentReturn();
      }
    );

  return d;
}

function cashier(){

  const pending=
    s.orders.filter(
      o=>o.payment_method==="cash" &&
         o.payment_status==="pending_cash"
    );

  return header()+`

    <main class="container" style="padding-top:28px">

      <div class="section-title">
        <div>
          <h2>
            ${t("شاشة الكاشير","Cashier Dashboard")}
          </h2>
          <div class="muted">
            ${t(
              "أكد الدفع الكاش بعد استلام المبلغ من العميل.",
              "Confirm cash payments after receiving the money from the customer."
            )}
          </div>
        </div>

        <span class="badge">
          ${pending.length} ${t("طلبات معلقة","pending")}
        </span>
      </div>

      ${pending.length ? pending.map(o=>`
        <div class="panel" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
            <div>
              <b style="font-size:20px">#${o.id}</b>
              <div class="muted" style="margin-top:6px">
                ${t("الترابيزة","Table")} ${o.table_number} • ${money(o.total)}
              </div>
            </div>
            <span class="status s-new">
              ${t("في انتظار الكاش","Cash pending")}
            </span>
          </div>

          <p class="muted">
            ${(o.order_items||[]).map(i=>
              (i.name_ar||i.name||i.name_en)+" × "+i.quantity
            ).join(" • ")}
          </p>

          <div class="actions">
            <button class="btn" data-cash-view="${o.id}">
              🧾 ${t("الفاتورة","Invoice")}
            </button>
            <button class="btn gold" data-cash-confirm="${o.id}">
              ✓ ${t("تأكيد استلام الكاش","Confirm cash received")}
            </button>
          </div>
        </div>
      `).join("") : `
        <div class="panel" style="text-align:center;padding:40px">
          <div style="font-size:42px">💵</div>
          <h3>${t("لا توجد مدفوعات كاش معلقة","No pending cash payments")}</h3>
        </div>
      `}

    </main>
  `;
}

function bindCashier(){

  document.querySelectorAll("[data-cash-view]").forEach(btn=>{
    btn.onclick=()=>{
      const o=s.orders.find(x=>String(x.id)===String(btn.dataset.cashView));
      if(o) bill(o);
    };
  });

  document.querySelectorAll("[data-cash-confirm]").forEach(btn=>{
    btn.onclick=async()=>{
      const o=s.orders.find(x=>String(x.id)===String(btn.dataset.cashConfirm));
      if(!o || !s.sb) return;

      const ok=confirm(
        t(
          `هل استلمت مبلغ ${money(o.total)} من الترابيزة ${o.table_number}؟`,
          `Did you receive ${money(o.total)} from table ${o.table_number}?`
        )
      );

      if(!ok) return;

      btn.disabled=true;
      btn.textContent=t("جاري التأكيد...","Confirming...");

      const r=await s.sb
        .from("orders")
        .update({
          payment_status:"paid",
          payment_method:"cash",
          paid_at:new Date().toISOString()
        })
        .eq("id",o.id)
        .eq("payment_status","pending_cash");

      if(r.error){
        btn.disabled=false;
        btn.textContent=t("تأكيد استلام الكاش","Confirm cash received");
        alert(r.error.message);
        return;
      }

      await loadOrders();
    };
  });
}

function render(){

  document.documentElement.dir=
    s.lang==="ar"
      ?"rtl"
      :"ltr";

  document.getElementById(
    "app"
  ).innerHTML=
    s.mode==="cashier"
      ? cashier()
      : customer();

  if(s.mode==="cashier")
    bindCashier();
  else
    bind();
}


setInterval(
  ()=>{
    if(s.sb){
      loadOrders();
    }
  },
  5000
);


init();

</script>
