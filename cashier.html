<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c2422">
<title>RestoFlow — شاشة الكاشير</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ef; --panel:#ffffff; --panel2:#fbfcfb; --line:#d7ddda; --line-soft:#e2e7e4;
  --text:#202725; --text-dim:#4c5652; --muted:#7e8a85; --muted-dim:#a8b2ad; --top-bg:rgba(255,255,255,.92);
  --ink:#1c2422; --ink2:#26302c;
  --steel:#2f6f7a; --steel-dim:#1f4d55; --steel-tint:#e0eef0;
  --amber:#c9862c; --amber-dim:#96691f; --amber-tint:#faf0dd;
  --ember:#c23b2b; --ember-dim:#8f2a1e; --ember-tint:#fbe6e2;
  --free:#3f8f5b; --free-dim:#2c6b41; --free-tint:#e5f2e9;
  --shadow:0 1px 2px rgba(20,26,24,.04), 0 8px 24px -12px rgba(20,26,24,.12);
  --font-body:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#121615; --panel:#1b201f; --panel2:#212724; --line:#2b3230; --line-soft:#242b29;
  --text:#e7ece9; --text-dim:#b5bfba; --muted:#889390; --muted-dim:#5c655f; --top-bg:rgba(18,23,22,.9);
  --ink:#0e1211; --ink2:#171d1a;
  --steel-tint:#173238; --amber-tint:#2e2410; --ember-tint:#301813; --free-tint:#152a1c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);transition:background .2s,color .2s}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--font-num)}

/* ---------------- header ---------------- */
.top{position:sticky;top:0;z-index:30;background:var(--top-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 4vw;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--ink2),var(--ink));display:grid;place-items:center;color:var(--amber);font-size:18px;font-weight:800;border:1px solid var(--line)}
.brand b{font-weight:700;font-size:15.5px;display:block}
.brand small{color:var(--muted);font-weight:500;font-size:12px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--text);transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted-dim)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.dark{background:var(--ink);color:var(--amber);border-color:var(--ink)}
.btn.pay{background:var(--free);color:#fff;border-color:var(--free)}
.btn.pay:hover{border-color:var(--free)}
.btn.icon{width:38px;padding:9px 0;text-align:center}
.live-pill{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--free);box-shadow:0 0 0 3px var(--free-tint)}

.container{max-width:1180px;margin:auto;padding:24px 4vw 12px}
.banner{border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;line-height:1.6}
.banner.err{background:var(--ember-tint);color:var(--ember-dim);border:1px solid #c23b2b55}
.banner .x{margin-inline-start:auto;border:none;background:transparent;color:inherit;font-size:13px;opacity:.7;flex:none}

/* ---------------- QR ticket ---------------- */
.qr-wrap{position:relative;margin-bottom:18px}
.qr-panel{position:relative;background:linear-gradient(128deg,var(--ink),var(--ink2));color:#eef1ee;border-radius:20px;padding:24px 30px;display:flex;gap:10px;align-items:center;justify-content:space-between;overflow:hidden}
.qr-panel::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:1px;background-image:repeating-linear-gradient(to bottom,#eef1ee33 0 8px,transparent 8px 16px);display:none}
.qr-left{display:flex;flex-direction:column;gap:7px;z-index:1}
.qr-eyebrow{color:#aeb8b3;font-size:12.5px;font-weight:600}
.qr-code-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.qr-code-text{font-size:30px;font-weight:800;letter-spacing:5px;color:var(--amber)}
.qr-code-text.loading{font-size:15px;letter-spacing:normal;color:#aeb8b3;font-weight:600}
.qr-sub{color:#c7cfcb;font-size:13px}
.qr-countdown-chip{display:inline-flex;align-items:center;gap:7px;background:#ffffff14;border:1px solid #ffffff22;border-radius:100px;padding:5px 12px;font-size:12.5px;color:#eef1ee;width:fit-content}
.qr-countdown-chip .num{font-weight:700}
.qr-countdown-chip.warn{background:var(--ember-tint);color:var(--ember-dim);border-color:transparent}
.qr-stub{position:relative;background:#fff;border-radius:14px;padding:10px;display:grid;place-items:center;min-height:132px;min-width:132px;z-index:1}
.qr-notch{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--bg);z-index:2}
.qr-notch.l{inset-inline-start:-11px}
.qr-notch.r{inset-inline-start:auto;inset-inline-end:calc(-1 * (30px - 11px))}
[data-theme="dark"] .qr-notch{background:var(--bg)}

/* ---------------- KPIs ---------------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow)}
.kpi{padding:15px 18px;border-inline-start:1px solid var(--line)}
.kpi:first-child{border-inline-start:none}
.kpi .lbl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .dot{width:7px;height:7px;border-radius:50%;flex:none}
.kpi.c-steel .dot{background:var(--steel)}.kpi.c-amber .dot{background:var(--amber)}.kpi.c-ember .dot{background:var(--ember)}
.kpi b{display:block;font-family:var(--font-num);font-size:23px;margin-top:7px;font-weight:700}

/* ---------------- section / legend ---------------- */
.section-title{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.section-title h2{margin:0;font-size:16.5px;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend .free i{background:var(--free)}.legend .active i{background:var(--steel)}.legend .due i{background:var(--ember)}

/* ---------------- table grid ---------------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
.tile{position:relative;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 12px 12px;text-align:start;box-shadow:var(--shadow);transition:transform .1s,border-color .15s}
.tile:hover{border-color:var(--muted-dim)}
.tile:active{transform:scale(.97)}
.tile .num{font-family:var(--font-num);font-weight:700;font-size:21px;line-height:1}
.tile .status{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:600}
.tile .status i{width:7px;height:7px;border-radius:50%;flex:none}
.tile .amt{margin-top:9px;font-family:var(--font-num);font-weight:700;font-size:14px;padding-top:9px;border-top:1px dashed var(--line-soft)}
.tile.free{border-color:var(--line)}
.tile.active{border-color:var(--steel);background:var(--steel-tint)}
.tile.active .status i{background:var(--steel)}
.tile.due{border-color:var(--ember);background:var(--ember-tint)}
.tile.due .status i{background:var(--ember)}
.tile.due .amt{color:var(--ember-dim);border-top-color:#c23b2b33}
.tile.free .status i{background:var(--free)}
.tile.selected{outline:2px solid var(--ink);outline-offset:2px}
.empty-note{text-align:center;padding:40px;color:var(--muted-dim);grid-column:1/-1}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;background:#0e12119c;opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-inline-end:0;top:0;bottom:0;width:min(400px,92vw);background:var(--panel);z-index:41;box-shadow:-16px 0 40px -16px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{margin:0;font-size:17px}
.drawer-head .st{font-size:12.5px;color:var(--muted);margin-top:3px}
.drawer-close{border:none;background:var(--panel2);width:32px;height:32px;border-radius:9px;color:var(--text);font-size:15px;flex:none}
.drawer-body{padding:16px 20px;overflow-y:auto;flex:1}
.order-block{border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.order-block .oh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.order-block .oh .badge{font-weight:700}
.order-block .oh .badge.served{color:var(--ember-dim)}
.order-block .oh .badge.active{color:var(--steel-dim)}
.item-row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--text-dim)}
.item-row b{color:var(--text);font-weight:600}
.drawer-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.drawer-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.drawer-total .mono{font-size:17px}
.drawer-empty{text-align:center;padding:36px 10px;color:var(--muted-dim);font-size:13.5px}

footer{padding:30px 4vw;color:var(--muted-dim);text-align:center;font-size:12.5px}

@media(max-width:640px){
  .kpis{grid-template-columns:1fr}
  .kpi{border-inline-start:none;border-top:1px solid var(--line)}
  .kpi:first-child{border-top:none}
  .qr-panel{flex-direction:column;align-items:stretch;text-align:center}
  .qr-left{align-items:center}
  .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
</style>
</head>
<body><div id="app"></div>
<script>
const CONFIG={
  SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",
  RESTAURANT_NAME:"RestoFlow", CURRENCY:"ج.م", TABLES:30,
  QR_TABLE:"cashier_qr_codes",   // now a single row, id = QR_ROW_ID, updated in place every hour
  QR_ROW_ID:1
};

let s={
  lang:"ar", sb:null, theme:localStorage.getItem("rf_theme")||"light",
  orders:[], loading:true, error:null,
  qr:{code:null,expiresAt:null,loading:true},
  now:new Date(),
  selectedTable:null, drawerOpen:false
};
const t=(a,e)=>s.lang==="ar"?a:e;
const money=n=>`${Number(n||0).toLocaleString(s.lang==="ar"?"ar-EG":"en-US")} ${CONFIG.CURRENCY}`;

/* ---------------- hourly QR code, updated in place ----------------
   A single row (id = QR_ROW_ID) holds the current code. Every hour we
   overwrite that same row with a fresh code + new expiry instead of
   inserting a new one — the table never grows. Two cashier screens
   racing at the same moment both try to write; whichever write lands
   last simply wins, and both screens re-read the same row a moment
   later, so they stay in sync. Requires QR_TABLE to have an integer
   "id" primary key column. */
function nextHourBoundary(d){
  const n=new Date(d); n.setUTCMinutes(0,0,0); n.setUTCHours(n.getUTCHours()+1); return n;
}
function randomCode(len=8){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous chars (0/O, 1/I)
  const bytes=new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>chars[b%chars.length]).join("");
}
async function ensureHourlyQR(){
  if(!s.sb)return;
  s.qr.loading=true; render();
  try{
    let {data,error}=await s.sb.from(CONFIG.QR_TABLE).select("*").eq("id",CONFIG.QR_ROW_ID).maybeSingle();
    if(error) throw error;
    const now=new Date();
    if(!data || !data.expires_at || new Date(data.expires_at)<=now){
      const expires=nextHourBoundary(now);
      const {data:upserted,error:upErr}=await s.sb.from(CONFIG.QR_TABLE)
        .upsert({id:CONFIG.QR_ROW_ID,code:randomCode(),expires_at:expires.toISOString()},{onConflict:"id"})
        .select().maybeSingle();
      if(upErr) throw upErr;
      data=upserted;
    }
    s.qr={code:data.code,expiresAt:new Date(data.expires_at),loading:false};
    s.error=null;
  }catch(e){
    s.qr.loading=false;
    s.error=e.message||String(e);
  }
  render();
}

/* ---------------- orders, grouped per table ---------------- */
async function fetchOrders(){
  if(!s.sb)return;
  s.loading=true;
  try{
    const {data,error}=await s.sb.from("orders").select("*,order_items(*)")
      .neq("status","paid").order("table_number",{ascending:true});
    if(error)throw error;
    s.orders=data||[];
    s.error=null;
  }catch(e){ s.error=e.message||String(e); }
  s.loading=false;
  render();
}
function ordersFor(n){ return s.orders.filter(o=>o.table_number===n); }
function tableState(n){
  const os=ordersFor(n);
  if(!os.length) return "free";
  if(os.some(o=>o.status==="served")) return "due";
  return "active";
}
function tableDue(n){
  return ordersFor(n).filter(o=>o.status==="served").reduce((a,o)=>a+Number(o.total||0),0);
}
function allDueTables(){
  const set=new Set();
  s.orders.forEach(o=>{ if(o.status==="served") set.add(o.table_number); });
  return [...set];
}

/* cashier action: mark every served (unpaid) order on that table as paid */
async function markTablePaid(n){
  if(!s.sb)return;
  const ids=ordersFor(n).filter(o=>o.status==="served").map(o=>o.id);
  if(!ids.length)return;
  const r=await s.sb.from("orders").update({status:"paid"}).in("id",ids);
  if(r.error){ alert(r.error.message); return; }
  s.drawerOpen=false; s.selectedTable=null;
  await fetchOrders();
}

/* ---------------- render ---------------- */
function header(){
  return `<header class="top">
    <div class="brand"><div class="logo">R</div><div><b>${CONFIG.RESTAURANT_NAME}</b><small>${t("شاشة الكاشير","Cashier screen")}</small></div></div>
    <div class="actions">
      <span class="live-pill"><span class="dot"></span>${t("متصل مباشرة","Live")}</span>
      <button class="btn icon" id="themeToggle">${s.theme==="dark"?"☀️":"🌙"}</button>
      <button class="btn dark" id="lang">${s.lang==="ar"?"EN":"عربي"}</button>
    </div>
  </header>`;
}
function fmtCountdown(){
  if(!s.qr.expiresAt)return "—";
  const ms=s.qr.expiresAt-s.now;
  if(ms<=0)return t("جارِ التجديد…","Refreshing…");
  const m=Math.floor(ms/60000), sec=Math.floor((ms%60000)/1000);
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}
function qrPanel(){
  const soon=s.qr.expiresAt && (s.qr.expiresAt-s.now)<60000;
  return `<div class="qr-wrap"><section class="qr-panel">
    <div class="qr-left">
      <div class="qr-eyebrow">${t("كود الدفع الكاش الحالي","Current cash-payment code")}</div>
      <div class="qr-code-row">
        ${s.qr.loading?`<div class="qr-code-text loading">${t("جارِ التحميل…","Loading…")}</div>`
          :`<div class="qr-code-text mono">${s.qr.code||"—"}</div>`}
      </div>
      <div class="qr-sub">${t("بيتحدّث تلقائيًا كل ساعة — نفس السجل، مش سجل جديد","Updates in place every hour")}</div>
      ${s.qr.loading?"":`<div class="qr-countdown-chip${soon?" warn":""}" id="qrCountdown">${t("كود جديد بعد","New code in")} <span class="num mono">${fmtCountdown()}</span></div>`}
    </div>
    <div class="qr-stub" id="qrBox"></div>
  </section></div>`;
}
function kpis(){
  const dueTables=allDueTables();
  const totalDue=dueTables.reduce((a,n)=>a+tableDue(n),0);
  const dueOrders=s.orders.filter(o=>o.status==="served").length;
  return `<div class="kpis">
    <div class="kpi c-ember"><div class="lbl"><span class="dot"></span>${t("ترابيزات محتاجة تحصيل","Tables awaiting payment")}</div><b>${dueTables.length}</b></div>
    <div class="kpi c-amber"><div class="lbl"><span class="dot"></span>${t("إجمالي المطلوب تحصيله","Total due now")}</div><b>${money(totalDue)}</b></div>
    <div class="kpi c-steel"><div class="lbl"><span class="dot"></span>${t("عدد الطلبات المستحقة","Orders awaiting payment")}</div><b>${dueOrders}</b></div>
  </div>`;
}
function tile(n){
  const state=tableState(n);
  const due=state==="due"?tableDue(n):0;
  const selected=s.selectedTable===n?" selected":"";
  const label=state==="due"?t("جاهزة للتحصيل","Ready to collect"):state==="active"?t("عليها طلب","Order placed"):t("متاحة","Available");
  return `<button class="tile ${state}${selected}" data-table="${n}">
    <div class="num">${n}</div>
    <div class="status"><i></i>${label}</div>
    ${state==="due"?`<div class="amt">${money(due)}</div>`:""}
  </button>`;
}
function tablesSection(){
  const tiles=Array.from({length:CONFIG.TABLES},(_,i)=>i+1).map(tile).join("");
  return `<div class="section-title">
      <h2>${t("الترابيزات","Tables")}</h2>
      <div class="legend">
        <span class="free"><i></i>${t("متاحة","Available")}</span>
        <span class="active"><i></i>${t("عليها طلب","Order placed")}</span>
        <span class="due"><i></i>${t("جاهزة للتحصيل","Ready to collect")}</span>
      </div>
    </div>
    <div class="grid">${s.loading?`<div class="empty-note">${t("جارِ التحميل…","Loading…")}</div>`:tiles}</div>`;
}
function drawer(){
  const n=s.selectedTable;
  const open=s.drawerOpen&&n;
  if(!n) return `<div class="scrim"></div><div class="drawer"></div>`;
  const os=ordersFor(n);
  const due=tableDue(n);
  const hasDue=os.some(o=>o.status==="served");
  const body=os.length?os.map(o=>{
    const items=(o.order_items||[]).map(i=>`<div class="item-row"><span>${i.name_ar||i.name||i.name_en}</span><b>×${i.quantity}</b></div>`).join("");
    return `<div class="order-block">
      <div class="oh"><span class="badge ${o.status==='served'?'served':'active'}">${o.status==='served'?t('جاهز للدفع','Ready to pay'):t('جاري التحضير','In progress')}</span><span class="mono">${money(o.total)}</span></div>
      ${items||`<div class="item-row">${t("لا توجد تفاصيل","No item details")}</div>`}
    </div>`;
  }).join(""):`<div class="drawer-empty">${t("مفيش طلبات مفتوحة على الترابيزة دي دلوقتي","No open orders on this table right now")}</div>`;
  return `<div class="scrim${open?" open":""}" id="scrim"></div>
  <div class="drawer${open?" open":""}">
    <div class="drawer-head">
      <div><h3>${t("ترابيزة","Table")} ${n}</h3><div class="st">${os.length} ${t("طلب","order(s)")}</div></div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body">${body}</div>
    ${hasDue?`<div class="drawer-foot">
      <div class="drawer-total"><span>${t("الإجمالي المطلوب","Total due")}</span><span class="mono">${money(due)}</span></div>
      <button class="btn pay" id="drawerPay">✓ ${t("تسجيل الدفع","Mark table as paid")}</button>
    </div>`:""}
  </div>`;
}
function main(){
  return header()+`<main class="container">
    ${s.error?`<div class="banner err"><span>⚠</span><span>${t("حصل خطأ:","Error:")} ${s.error}</span><button class="x" id="dismissErr">✕</button></div>`:""}
    ${qrPanel()}
    ${kpis()}
    ${tablesSection()}
  </main>
  <footer>RestoFlow Cashier</footer>${drawer()}`;
}
function renderQRCode(){
  const box=document.getElementById("qrBox");
  if(!box || !s.qr.code)return;
  box.innerHTML="";
  new QRCode(box,{text:s.qr.code,width:118,height:118});
}
function bind(){
  document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});
  document.getElementById("themeToggle")?.addEventListener("click",()=>{
    s.theme=s.theme==="dark"?"light":"dark"; localStorage.setItem("rf_theme",s.theme); render();
  });
  document.getElementById("dismissErr")?.addEventListener("click",()=>{s.error=null;render()});
  document.querySelectorAll("[data-table]").forEach(b=>{
    b.onclick=()=>{ s.selectedTable=Number(b.dataset.table); s.drawerOpen=true; render(); };
  });
  document.getElementById("drawerClose")?.addEventListener("click",()=>{ s.drawerOpen=false; render(); });
  document.getElementById("scrim")?.addEventListener("click",()=>{ s.drawerOpen=false; render(); });
  document.getElementById("drawerPay")?.addEventListener("click",(e)=>{
    e.target.disabled=true; e.target.textContent=t("جارِ التسجيل…","Saving…");
    markTablePaid(s.selectedTable);
  });
}
function render(){
  document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";
  document.documentElement.setAttribute("data-theme",s.theme);
  document.getElementById("app").innerHTML=main();
  bind();
  renderQRCode();
}

async function init(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
    await Promise.all([ensureHourlyQR(),fetchOrders()]);
    let debounce=null;
    s.sb.channel("rf-cashier-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"},()=>{
        clearTimeout(debounce); debounce=setTimeout(fetchOrders,500);
      })
      .subscribe();
  }else{
    render();
  }
  // once a second: just tick the countdown text; only trigger a full
  // QR refresh + re-render when the current code actually expires
  setInterval(()=>{
    s.now=new Date();
    if(s.qr.expiresAt && s.now>=s.qr.expiresAt){ ensureHourlyQR(); return; }
    const el=document.getElementById("qrCountdown");
    if(el) el.innerHTML=`${t("كود جديد بعد","New code in")} <span class="num mono">${fmtCountdown()}</span>`;
  },1000);
}

init();
</script>
</body>
</html>
