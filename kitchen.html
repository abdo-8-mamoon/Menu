<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>RestoFlow — شاشة المطبخ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b0d12;--panel:#12151c;--panel2:#171b24;--line:#252a35;--text:#f4f5f7;--muted:#8991a3;
  --gold:#e0a83f;--red:#ef4444;--redglow:#ef444433;--amber:#f59e0b;--amberglow:#f59e0b33;
  --green:#22c55e;--greenglow:#22c55e33;--blue:#3b82f6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Tahoma',Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button{font:inherit;cursor:pointer}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:#0b0d12ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#e0a83f,#8c5f20);display:grid;place-items:center;color:#111;font-size:21px;font-weight:900}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:1px;color:var(--gold)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:11px;font-weight:700}
.btn:active{transform:scale(.96)}
.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.ghost{background:transparent}
.snd{display:flex;align-items:center;gap:8px}
.snd input{width:18px;height:18px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.stat b{display:block;font-size:34px;margin-top:4px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.new{background:var(--red)}.dot.prep{background:var(--amber)}.dot.ready{background:var(--green)}.dot.all{background:var(--blue)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 22px 26px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:200px;display:flex;flex-direction:column}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.col-head h2{margin:0;font-size:17px;display:flex;align-items:center;gap:9px}
.col-count{background:var(--panel2);border-radius:999px;padding:3px 11px;font-weight:800;font-size:14px}
.col-body{display:flex;flex-direction:column;gap:12px;flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}

/* order card */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;transition:.2s}
.card.urg-ok{border-left:5px solid var(--green)}
.card.urg-warn{border-left:5px solid var(--amber);box-shadow:0 0 0 1px var(--amberglow)}
.card.urg-late{border-left:5px solid var(--red);box-shadow:0 0 22px var(--redglow)}
.card.flash{animation:flashIn .9s ease 2}
@keyframes flashIn{0%,100%{background:var(--panel2)}50%{background:#3a2410}}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.tnum{font-size:22px;font-weight:900}
.oid{color:var(--muted);font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:15px;padding:4px 10px;border-radius:999px;background:var(--panel);white-space:nowrap}
.timer.urg-ok{color:var(--green)}.timer.urg-warn{color:var(--amber)}.timer.urg-late{color:var(--red)}
.items{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;justify-content:space-between;gap:8px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.items li:last-child{border-bottom:0;padding-bottom:0}
.iqty{background:var(--gold);color:#111;font-weight:900;border-radius:8px;padding:1px 8px;font-size:13px;min-width:26px;text-align:center}
.card-actions{display:flex;gap:8px}
.card-actions .btn{flex:1;padding:12px 8px;font-size:14px;text-align:center}
.act-start{background:var(--amber);border-color:var(--amber);color:#111}
.act-ready{background:var(--green);border-color:var(--green);color:#0a1f13}
.act-served{background:var(--panel);color:var(--text)}

@media(max-width:1000px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.top{padding:12px 14px}.stats{padding:14px}.board{padding:0 14px 20px}.clock{font-size:17px}}
</style>
</head>
<body><div id="app"></div>
<script>
const CONFIG={
  SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",
  RESTAURANT_NAME:"RestoFlow", DEFAULT_LANGUAGE:"ar",
  WARN_MINUTES:8,   // yellow after this many minutes
  LATE_MINUTES:15   // red after this many minutes
};

let s={lang:CONFIG.DEFAULT_LANGUAGE,orders:[],sb:null,sound:true,knownIds:new Set(),flashIds:new Set()};

const t=(a,e)=>s.lang==="ar"?a:e;

/* ---- sound alert (no external files, generated tone) ---- */
let audioCtx=null;
function beep(){
  if(!s.sound)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    [0,0.18].forEach(delay=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,now+delay);
      g.gain.exponentialRampToValueAtTime(0.35,now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now+delay); o.stop(now+delay+0.18);
    });
  }catch(e){}
}

async function init(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
    await loadOrders(true);
    s.sb.channel("rf-kitchen-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{await loadOrders()})
      .on("postgres_changes",{event:"*",schema:"public",table:"order_items"},async()=>{await loadOrders()})
      .subscribe();
  }
  render();
  setInterval(tickClock,1000);
  setInterval(()=>{ if(s.sb) loadOrders(); },300000);
}

async function loadOrders(isFirstLoad){
  if(!s.sb)return;
  const r=await s.sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);
  if(r.error||!r.data)return;

  const newOrders=r.data.filter(o=>o.status==="new" && !s.knownIds.has(String(o.id)));
  if(!isFirstLoad && newOrders.length){ beep(); newOrders.forEach(o=>s.flashIds.add(String(o.id))); }

  r.data.forEach(o=>s.knownIds.add(String(o.id)));
  s.orders=r.data;
  render();

  if(newOrders.length){
    setTimeout(()=>{ newOrders.forEach(o=>s.flashIds.delete(String(o.id))); render(); },2000);
  }
}

function minutesSince(dateStr){
  if(!dateStr)return 0;
  return (Date.now()-new Date(dateStr).getTime())/60000;
}
function urgency(dateStr){
  const m=minutesSince(dateStr);
  if(m>=CONFIG.LATE_MINUTES)return "urg-late";
  if(m>=CONFIG.WARN_MINUTES)return "urg-warn";
  return "urg-ok";
}
function fmtElapsed(dateStr){
  const totalSec=Math.max(0,Math.floor((Date.now()-new Date(dateStr||Date.now()).getTime())/1000));
  const mm=Math.floor(totalSec/60), ss=totalSec%60;
  return `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}

function header(){
  return `<header class="top">
    <div class="brand"><div class="logo">R</div><div>${CONFIG.RESTAURANT_NAME}
      <small>${t("شاشة عرض المطبخ","Kitchen Display System")}</small>
    </div></div>
    <div class="clock" id="clock"></div>
    <div class="top-actions">
      <label class="snd btn ghost"><input type="checkbox" id="soundToggle" ${s.sound?"checked":""}> 🔔 ${t("صوت التنبيه","Alert sound")}</label>
      <button class="btn" id="lang">${s.lang==="ar"?"EN":"عربي"}</button>
    </div>
  </header>`;
}

function statsBar(){
  const n=s.orders.filter(o=>o.status==="new").length;
  const p=s.orders.filter(o=>o.status==="preparing").length;
  const rd=s.orders.filter(o=>o.status==="ready").length;
  return `<section class="stats">
    <div class="stat"><div class="lbl"><span class="dot new"></span>${t("طلبات جديدة","New orders")}</div><b>${n}</b></div>
    <div class="stat"><div class="lbl"><span class="dot prep"></span>${t("قيد التحضير","Preparing")}</div><b>${p}</b></div>
    <div class="stat"><div class="lbl"><span class="dot ready"></span>${t("جاهز للتقديم","Ready")}</div><b>${rd}</b></div>
    <div class="stat"><div class="lbl"><span class="dot all"></span>${t("إجمالي الطابور","Total in queue")}</div><b>${n+p+rd}</b></div>
  </section>`;
}

function board(){
  const cols=[
    {key:"new",   title:t("🆕 جديد","🆕 New"),         data:s.orders.filter(o=>o.status==="new")},
    {key:"preparing",title:t("🔥 قيد التحضير","🔥 Preparing"),data:s.orders.filter(o=>o.status==="preparing")},
    {key:"ready", title:t("✅ جاهز","✅ Ready"),         data:s.orders.filter(o=>o.status==="ready")}
  ];
  return `<section class="board">
    ${cols.map(c=>`
      <div class="col">
        <div class="col-head"><h2>${c.title}</h2><span class="col-count">${c.data.length}</span></div>
        <div class="col-body">
          ${c.data.length ? c.data.map(orderCard).join("") : `<div class="empty">${t("لا توجد طلبات","No orders")}</div>`}
        </div>
      </div>
    `).join("")}
  </section>`;
}

function orderCard(o){
  const urg=urgency(o.created_at);
  const flashing=s.flashIds.has(String(o.id));
  let actionBtn="";
  if(o.status==="new")actionBtn=`<button class="btn act-start" data-status="${o.id}:preparing">▶️ ${t("ابدأ التحضير","Start")}</button>`;
  if(o.status==="preparing")actionBtn=`<button class="btn act-ready" data-status="${o.id}:ready">✅ ${t("جاهز","Ready")}</button>`;
  if(o.status==="ready")actionBtn=`<button class="btn act-served" data-status="${o.id}:served">📦 ${t("تم التقديم","Served")}</button>`;

  return `<div class="card ${urg} ${flashing?"flash":""}" data-order-id="${o.id}" data-created="${o.created_at||""}">
    <div class="card-head">
      <div><div class="tnum">${t("ترابيزة","Table")} ${o.table_number||"—"}</div><div class="oid">#${o.id}</div></div>
      <div class="timer ${urg}" data-timer="${o.id}">${fmtElapsed(o.created_at)}</div>
    </div>
    <ul class="items">
      ${(o.order_items||[]).length ? (o.order_items||[]).map(i=>`<li><span>${i.name_ar||i.name||i.name_en||t("صنف","Item")}</span><span class="iqty">×${i.quantity}</span></li>`).join("") : `<li><span class="muted">${t("لا توجد تفاصيل","No item details")}</span></li>`}
    </ul>
    <div class="card-actions">${actionBtn}</div>
  </div>`;
}

async function updateStatus(id,status){
  if(s.sb){
    const r=await s.sb.from("orders").update({status}).eq("id",id);
    if(r.error){alert(r.error.message);return}
    await loadOrders();
  }else{
    const o=s.orders.find(x=>String(x.id)===String(id)); if(o)o.status=status;
    render();
  }
}

function tickClock(){
  const el=document.getElementById("clock");
  if(el)el.textContent=new Date().toLocaleTimeString(s.lang==="ar"?"ar-EG":"en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.querySelectorAll("[data-timer]").forEach(elT=>{
    const card=elT.closest(".card");
    const created=card?.dataset.created;
    if(!created)return;
    elT.textContent=fmtElapsed(created);
    const urg=urgency(created);
    elT.className="timer "+urg;
    card.classList.remove("urg-ok","urg-warn","urg-late");
    card.classList.add(urg);
  });
}

function bind(){
  document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});
  document.getElementById("soundToggle")?.addEventListener("change",e=>{s.sound=e.target.checked; if(s.sound)beep();});
  document.querySelectorAll("[data-status]").forEach(b=>{
    const [id,status]=b.dataset.status.split(":");
    b.onclick=()=>updateStatus(id,status);
  });
}

function render(){
  document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";
  document.getElementById("app").innerHTML=header()+statsBar()+board();
  bind();
  tickClock();
}

init();
</script>
</body>
</html>
