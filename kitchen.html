<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141a">
<title>RestoFlow — شاشة المطبخ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10141a;
  --rail:#0c0f14;
  --panel:#171d25;
  --panel2:#1d242e;
  --line:#2a3341;
  --line-soft:#242c38;
  --text:#eef1f6;
  --muted:#7d899b;
  --muted-dim:#57626f;
  --brass:#e8ac4d;
  --brass-dim:#8a6a2f;
  --incoming:#5ea7e8;
  --active:#f0ab2e;
  --complete:#2fd4a5;
  --ok:#2fd4a5;
  --warn:#f0ab2e;
  --late:#fb4d5c;
  --late-glow:#fb4d5c3d;
  --font-body:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);overflow-x:hidden;
  background-image:
    radial-gradient(1200px 500px at 15% -10%, #1c2734 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #1a1f2a 0%, transparent 55%);
}
button{font:inherit;cursor:pointer}

/* ============ TOP RAIL ============ */
.top{
  position:sticky;top:0;z-index:30;background:var(--rail)f2;backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:0;
}
.top-inner{padding:14px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hazard{height:4px;width:100%;background:repeating-linear-gradient(-45deg,var(--brass) 0 14px,#1a1f2a 14px 28px);opacity:.55}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(155deg,#f2c579,var(--brass-dim));display:grid;place-items:center;color:#171308;font-size:22px;font-weight:800;box-shadow:0 4px 14px #e8ac4d33;flex:none}
.brand-text b{font-size:19px;font-weight:700;letter-spacing:.2px;display:block}
.brand-text small{color:var(--muted);font-weight:500;font-size:12.5px;display:block;margin-top:1px}
.clock{font-family:var(--font-num);font-weight:700;font-size:23px;letter-spacing:1px;color:var(--brass);background:var(--panel);border:1px solid var(--line);padding:7px 16px;border-radius:9px}
.top-actions{display:flex;gap:9px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{border-color:var(--muted-dim)}
.btn:active{transform:scale(.96)}
.btn.brass{background:var(--brass);color:#1c1406;border-color:var(--brass);font-weight:700}
.snd{display:flex;align-items:center;gap:9px;user-select:none}
.snd input{width:17px;height:17px;accent-color:var(--brass)}

/* ============ STATS RAIL ============ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 24px 6px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;
  border-top:3px solid var(--stat-c,var(--brass));position:relative;
}
.stat.incoming{--stat-c:var(--incoming)}
.stat.active{--stat-c:var(--active)}
.stat.complete{--stat-c:var(--complete)}
.stat.total{--stat-c:var(--brass)}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-family:var(--font-num);font-size:32px;margin-top:6px;font-weight:700;color:var(--text)}

/* ============ BOARD ============ */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 24px 28px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;min-height:220px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 13px;margin-bottom:13px;border-bottom:1px solid var(--line-soft)}
.col-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px}
.col-flag{width:9px;height:9px;border-radius:2px;flex:none}
.col.new .col-flag{background:var(--incoming)}
.col.preparing .col-flag{background:var(--active)}
.col.ready .col-flag{background:var(--complete)}
.col-count{font-family:var(--font-num);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.col-body{display:flex;flex-direction:column;gap:11px;flex:1}
.empty{text-align:center;color:var(--muted-dim);padding:44px 10px;font-size:13.5px}

/* ============ TICKET CARD ============ */
.card{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  transition:box-shadow .25s, border-color .25s;
}
.card.urg-ok{box-shadow:inset 3px 0 0 var(--ok)}
.card.urg-warn{box-shadow:inset 3px 0 0 var(--warn)}
.card.urg-late{box-shadow:inset 3px 0 0 var(--late), 0 0 0 1px var(--late-glow);border-color:#fb4d5c55}
.card.flash{animation:flashIn .85s ease 2}
@keyframes flashIn{0%,100%{background:var(--panel2)}50%{background:#3a2b12}}

.ticket-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;gap:10px}
.tnum{font-size:20px;font-weight:700}
.oid{font-family:var(--font-num);color:var(--muted);font-size:11.5px;margin-top:2px}
.timer{
  font-family:var(--font-num);font-weight:700;font-size:15px;padding:5px 11px;border-radius:8px;
  background:var(--rail);border:1px solid var(--line);white-space:nowrap;letter-spacing:.5px;
}
.timer.urg-ok{color:var(--ok)}.timer.urg-warn{color:var(--warn)}.timer.urg-late{color:var(--late)}

.perf{height:12px;background:
  radial-gradient(circle 4.5px at 12px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 28px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 44px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 60px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 76px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 92px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 108px 50%, var(--panel) 99%, transparent 100%),
  radial-gradient(circle 4.5px at 124px 50%, var(--panel) 99%, transparent 100%);
  background-repeat:repeat-x;background-color:var(--panel2);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
}

.items{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.items li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px}
.iqty{font-family:var(--font-num);background:var(--rail);border:1px solid var(--line);color:var(--brass);font-weight:700;border-radius:7px;padding:2px 9px;font-size:12.5px;min-width:28px;text-align:center;flex:none}

.card-actions{display:flex;gap:8px;padding:0 14px 14px}
.card-actions .btn{flex:1;padding:12px 8px;font-size:14px;text-align:center;border-radius:9px}
.act-start{background:var(--active);border-color:var(--active);color:#241905;font-weight:700}
.act-ready{background:var(--complete);border-color:var(--complete);color:#062820;font-weight:700}
.act-served{background:var(--panel);color:var(--text)}

@media(max-width:1000px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.top-inner{padding:12px 14px}.stats{padding:14px 14px 4px}.board{padding:14px 14px 20px}.clock{font-size:16px;padding:6px 11px}.brand-text small{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const CONFIG={
  SUPABASE_URL:"https://rovuwlpkmscspjdtjipl.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_slGnzuYx_rVNKPL1AoCMbw_thK-RMJ9",
  RESTAURANT_NAME:"RestoFlow", DEFAULT_LANGUAGE:"ar",
  WARN_MINUTES:8,   // amber after this many minutes
  LATE_MINUTES:15   // red after this many minutes
};

let s={lang:CONFIG.DEFAULT_LANGUAGE,orders:[],sb:null,sound:true,knownIds:new Set(),flashIds:new Set()};

const t=(a,e)=>s.lang==="ar"?a:e;

/* ---- sound alert (generated tone, no external files) ---- */
let audioCtx=null;
function beep(){
  if(!s.sound)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime;
    [0,0.18].forEach(delay=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,now+delay);
      g.gain.exponentialRampToValueAtTime(0.35,now+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now+delay); o.stop(now+delay+0.18);
    });
  }catch(e){}
}

async function init(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    s.sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
    await loadOrders(true);
    s.sb.channel("rf-kitchen-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{await loadOrders()})
      .on("postgres_changes",{event:"*",schema:"public",table:"order_items"},async()=>{await loadOrders()})
      .subscribe();
  }
  render();
  setInterval(tickClock,1000);
  setInterval(()=>{ if(s.sb) loadOrders(); },300000);
}

async function loadOrders(isFirstLoad){
  if(!s.sb)return;
  const r=await s.sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false}).limit(100);
  if(r.error||!r.data)return;

  const newOrders=r.data.filter(o=>o.status==="new" && !s.knownIds.has(String(o.id)));
  if(!isFirstLoad && newOrders.length){ beep(); newOrders.forEach(o=>s.flashIds.add(String(o.id))); }

  r.data.forEach(o=>s.knownIds.add(String(o.id)));
  s.orders=r.data;
  render();

  if(newOrders.length){
    setTimeout(()=>{ newOrders.forEach(o=>s.flashIds.delete(String(o.id))); render(); },2000);
  }
}

function minutesSince(dateStr){
  if(!dateStr)return 0;
  return (Date.now()-new Date(dateStr).getTime())/60000;
}
function urgency(dateStr){
  const m=minutesSince(dateStr);
  if(m>=CONFIG.LATE_MINUTES)return "urg-late";
  if(m>=CONFIG.WARN_MINUTES)return "urg-warn";
  return "urg-ok";
}
function fmtElapsed(dateStr){
  const totalSec=Math.max(0,Math.floor((Date.now()-new Date(dateStr||Date.now()).getTime())/1000));
  const mm=Math.floor(totalSec/60), ss=totalSec%60;
  return `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}

function header(){
  return `<header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo">R</div>
        <div class="brand-text"><b>${CONFIG.RESTAURANT_NAME}</b><small>${t("شاشة عرض المطبخ","Kitchen Display System")}</small></div>
      </div>
      <div class="clock" id="clock"></div>
      <div class="top-actions">
        <label class="snd btn"><input type="checkbox" id="soundToggle" ${s.sound?"checked":""}> 🔔 ${t("صوت التنبيه","Alerts")}</label>
        <button class="btn brass" id="lang">${s.lang==="ar"?"EN":"عربي"}</button>
      </div>
    </div>
    <div class="hazard"></div>
  </header>`;
}

function statsBar(){
  const n=s.orders.filter(o=>o.status==="new").length;
  const p=s.orders.filter(o=>o.status==="preparing").length;
  const rd=s.orders.filter(o=>o.status==="ready").length;
  return `<section class="stats">
    <div class="stat incoming"><div class="lbl">${t("طلبات جديدة","New orders")}</div><b>${n}</b></div>
    <div class="stat active"><div class="lbl">${t("قيد التحضير","Preparing")}</div><b>${p}</b></div>
    <div class="stat complete"><div class="lbl">${t("جاهز للتقديم","Ready")}</div><b>${rd}</b></div>
    <div class="stat total"><div class="lbl">${t("إجمالي الطابور","Total in queue")}</div><b>${n+p+rd}</b></div>
  </section>`;
}

function board(){
  const cols=[
    {key:"new",title:t("جديد","New"),data:s.orders.filter(o=>o.status==="new")},
    {key:"preparing",title:t("قيد التحضير","Preparing"),data:s.orders.filter(o=>o.status==="preparing")},
    {key:"ready",title:t("جاهز","Ready"),data:s.orders.filter(o=>o.status==="ready")}
  ];
  return `<section class="board">
    ${cols.map(c=>`
      <div class="col ${c.key}">
        <div class="col-head"><div class="col-title"><span class="col-flag"></span>${c.title}</div><span class="col-count">${c.data.length}</span></div>
        <div class="col-body">
          ${c.data.length ? c.data.map(orderCard).join("") : `<div class="empty">${t("لا توجد طلبات","No orders")}</div>`}
        </div>
      </div>
    `).join("")}
  </section>`;
}

function orderCard(o){
  const urg=urgency(o.created_at);
  const flashing=s.flashIds.has(String(o.id));
  let actionBtn="";
  if(o.status==="new")actionBtn=`<button class="btn act-start" data-status="${o.id}:preparing">${t("ابدأ التحضير","Start")}</button>`;
  if(o.status==="preparing")actionBtn=`<button class="btn act-ready" data-status="${o.id}:ready">${t("جاهز","Ready")}</button>`;
  if(o.status==="ready")actionBtn=`<button class="btn act-served" data-status="${o.id}:served">${t("تم التقديم","Served")}</button>`;

  return `<div class="card ${urg} ${flashing?"flash":""}" data-order-id="${o.id}" data-created="${o.created_at||""}">
    <div class="ticket-head">
      <div><div class="tnum">${t("ترابيزة","Table")} ${o.table_number||"—"}</div><div class="oid">#${o.id}</div></div>
      <div class="timer ${urg}" data-timer="${o.id}">${fmtElapsed(o.created_at)}</div>
    </div>
    <div class="perf"></div>
    <ul class="items">
      ${(o.order_items||[]).length ? (o.order_items||[]).map(i=>`<li><span>${i.name_ar||i.name||i.name_en||t("صنف","Item")}</span><span class="iqty">×${i.quantity}</span></li>`).join("") : `<li><span class="muted">${t("لا توجد تفاصيل","No item details")}</span></li>`}
    </ul>
    <div class="card-actions">${actionBtn}</div>
  </div>`;
}

async function updateStatus(id,status){
  if(s.sb){
    const r=await s.sb.from("orders").update({status}).eq("id",id);
    if(r.error){alert(r.error.message);return}
    await loadOrders();
  }else{
    const o=s.orders.find(x=>String(x.id)===String(id)); if(o)o.status=status;
    render();
  }
}

function tickClock(){
  const el=document.getElementById("clock");
  if(el)el.textContent=new Date().toLocaleTimeString(s.lang==="ar"?"ar-EG":"en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.querySelectorAll("[data-timer]").forEach(elT=>{
    const card=elT.closest(".card");
    const created=card?.dataset.created;
    if(!created)return;
    elT.textContent=fmtElapsed(created);
    const urg=urgency(created);
    elT.className="timer "+urg;
    card.classList.remove("urg-ok","urg-warn","urg-late");
    card.classList.add(urg);
  });
}

function bind(){
  document.getElementById("lang")?.addEventListener("click",()=>{s.lang=s.lang==="ar"?"en":"ar";render()});
  document.getElementById("soundToggle")?.addEventListener("change",e=>{s.sound=e.target.checked; if(s.sound)beep();});
  document.querySelectorAll("[data-status]").forEach(b=>{
    const [id,status]=b.dataset.status.split(":");
    b.onclick=()=>updateStatus(id,status);
  });
}

function render(){
  document.documentElement.dir=s.lang==="ar"?"rtl":"ltr";
  document.getElementById("app").innerHTML=header()+statsBar()+board();
  bind();
  tickClock();
}

init();
</script>
</body>
</html>
